<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First United Methodist Church &amp; Wesley Foundation — Iowa City</title>
    <meta name="description" content="" id="metaDescription">
    <!-- The built-in tab icon. If one is set in the CMS, renderBrand() swaps it. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" id="faviconLink">
    <link rel="apple-touch-icon" href="favicon.svg" id="faviconTouch">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css?v=2">
</head>
<body>

    <!-- ===== Reusable Emblem (UMC cross & flame + rose window) ===== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <path id="petal" d="M100 96 C114 78 114 58 100 40 C86 58 86 78 100 96 Z"/>
            <path id="arcTop" d="M22 100 A78 78 0 0 1 178 100"/>
            <path id="arcBottom" d="M26 100 A74 74 0 0 0 174 100"/>
            <g id="emblemDef">
                <circle cx="100" cy="100" r="100" fill="#F2B705"/>
                <circle cx="100" cy="100" r="99" fill="none" stroke="#141210" stroke-width="1.5"/>
                <text font-family="Oswald, sans-serif" font-weight="700" fill="#141210" letter-spacing="1.5" font-size="14">
                    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">FIRST UMC AND WESLEY FOUNDATION</textPath>
                </text>
                <text font-family="Oswald, sans-serif" font-weight="700" fill="#141210" letter-spacing="3" font-size="14">
                    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">IOWA CITY</textPath>
                </text>
                <g stroke="#141210" stroke-width="1.4" fill="none" opacity="0.85">
                    <g>
                        <use href="#petal" transform="rotate(0 100 100)"/>
                        <use href="#petal" transform="rotate(30 100 100)"/>
                        <use href="#petal" transform="rotate(60 100 100)"/>
                        <use href="#petal" transform="rotate(90 100 100)"/>
                        <use href="#petal" transform="rotate(120 100 100)"/>
                        <use href="#petal" transform="rotate(150 100 100)"/>
                        <use href="#petal" transform="rotate(180 100 100)"/>
                        <use href="#petal" transform="rotate(210 100 100)"/>
                        <use href="#petal" transform="rotate(240 100 100)"/>
                        <use href="#petal" transform="rotate(270 100 100)"/>
                        <use href="#petal" transform="rotate(300 100 100)"/>
                        <use href="#petal" transform="rotate(330 100 100)"/>
                    </g>
                    <circle cx="100" cy="100" r="58"/>
                    <circle cx="100" cy="100" r="40"/>
                </g>
                <g fill="#141210">
                    <rect x="82" y="52" width="10" height="96" rx="2"/>
                    <rect x="62" y="76" width="50" height="10" rx="2"/>
                </g>
                <g fill="#D99A00">
                    <path d="M104 148 C90 132 104 118 100 100 C108 110 118 104 112 90 C124 100 128 82 118 68 C140 88 138 128 112 138 C124 142 122 150 104 148 Z"/>
                    <path d="M112 132 C104 122 112 112 110 100 C118 108 122 96 118 86 C130 98 128 122 112 132 Z" fill="#F2B705"/>
                </g>
                <circle cx="100" cy="100" r="6" fill="#141210"/>
            </g>
        </defs>
    </svg>

    <nav id="navbar"></nav>

    <main id="pageBody"></main>

    <footer id="siteFooter"></footer>

    <!-- ===== Photo lightbox ===== -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lb-btn lb-close" id="lbClose" aria-label="Close"><i class="fas fa-times"></i></button>
        <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
        <img id="lbImg" src="" alt="">
        <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-cap"><strong id="lbTitle"></strong><span id="lbDesc"></span></div>
    </div>

    <script src="blocks.js?v=2"></script>
    <script src="content.js?v=2"></script>
    <script src="render.js?v=2"></script>
    <script>
        /* =========================================================
           This file only DISPLAYS the site. Everything on it is
           edited in the CMS at /admin — there is no editor here.

           It is also the canvas the CMS draws in: loaded with ?edit=1
           inside the editor's frame, it turns on click-to-select and
           takes its content from the editor rather than the server.
           ========================================================= */
        var API = 'api.php';
        var CACHE_KEY = 'fumc_site_cache_v3';

        // Deliberately not filled in here: building the default content needs
        // blocks.js, and if that file is missing this line would throw before
        // init() below ever got the chance to say so. init() sets it.
        var data = null;
        var currentPage = null;

        /* Which page is being asked for? The web server rewrites every
           unknown address to this file, so the path is the page's slug. */
        var params = new URLSearchParams(location.search);
        var EDIT = params.get('edit') === '1';
        var forcedPageId = params.get('page') || '';

        function slugFromUrl() {
            if (params.get('p')) return params.get('p');
            var path = location.pathname.replace(/^\/+|\/+$/g, '');
            if (!path || /^index\.html?$/i.test(path)) return '';
            // Only the first segment names a page.
            return path.split('/')[0];
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        /* A CMS percentage turned into a CSS multiplier. */
        function ratio(pct) {
            var n = parseFloat(pct);
            if (!isFinite(n) || n <= 0) n = 100;
            return (n / 100).toFixed(3);
        }

        /* The top bar is fixed, so the page below has to know how tall it
           is — and it grows with the logo. Measured rather than calculated
           so the menu wrapping onto a second line is accounted for too. */
        function measureNav() {
            var nav = document.getElementById('navbar');
            if (!nav) return;
            document.documentElement.style.setProperty('--nav-h', Math.round(nav.offsetHeight) + 'px');
        }

        /* The tab icon: whatever the CMS was given, else the logo, else the
           built-in emblem already sitting in the <head>. */
        function renderFavicon() {
            var href = data.brand.favicon || data.brand.logoImage || 'favicon.svg';
            ['faviconLink', 'faviconTouch'].forEach(function (id) {
                var link = document.getElementById(id);
                if (!link || link.getAttribute('href') === href) return;
                link.setAttribute('href', href);
                // The type only holds for the built-in SVG; an uploaded icon
                // could be any format, so let the browser work it out.
                if (href === 'favicon.svg') link.setAttribute('type', 'image/svg+xml');
                else link.removeAttribute('type');
            });
        }

        /* =========================================================
           RENDER
           ========================================================= */
        var selected = null;     // only used in edit mode

        function resolvePage() {
            if (forcedPageId) {
                var byId = SITE.pageById(data, forcedPageId);
                if (byId) return byId;
            }
            return SITE.pageBySlug(data, slugFromUrl());
        }

        function renderAll() {
            currentPage = resolvePage();

            // Sizes that the CMS controls, applied as CSS variables.
            var b = data.brand;
            var root = document.documentElement;
            var navPx = parseFloat(b.navLogoSize);
            if (!isFinite(navPx) || navPx <= 0) navPx = 62;
            root.style.setProperty('--nav-logo-size', Math.round(navPx) + 'px');
            var navW = parseFloat(b.navLogoMaxWidth);
            if (!isFinite(navW) || navW <= 0) navW = 240;
            root.style.setProperty('--nav-logo-max-width', Math.round(navW) + 'px');
            root.style.setProperty('--logo-scale', ratio(b.logoScale));

            renderFavicon();
            renderTitle();

            document.getElementById('navbar').innerHTML = RENDER.nav(data, currentPage);
            document.getElementById('pageBody').innerHTML =
                RENDER.page(data, currentPage, { edit: EDIT, selected: selected });
            document.getElementById('siteFooter').innerHTML = RENDER.footer(data, currentPage);

            wireNav();
            RENDER.activate(document, { edit: EDIT });
            collectLightbox();
            measureNav();
        }

        function renderTitle() {
            var seo = (currentPage && currentPage.seo) || {};
            var base = data.brand.browserTitle || data.brand.titleFull || '';
            if (seo.title) document.title = seo.title;
            else if (currentPage && !currentPage.home) document.title = currentPage.title + (base ? ' — ' + base : '');
            else document.title = base;

            var meta = document.getElementById('metaDescription');
            if (meta) meta.setAttribute('content', seo.description || '');
        }

        function wireNav() {
            var navbar = document.getElementById('navbar');
            var links = document.getElementById('navLinks');
            var btn = document.getElementById('mobileMenuBtn');
            if (btn && links) {
                btn.addEventListener('click', function () {
                    var open = links.classList.toggle('active');
                    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
                links.querySelectorAll('a').forEach(function (a) {
                    a.addEventListener('click', function () {
                        links.classList.remove('active');
                        btn.setAttribute('aria-expanded', 'false');
                    });
                });
            }
            if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 40);
        }

        window.addEventListener('scroll', function () {
            var navbar = document.getElementById('navbar');
            if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 40);
        });
        window.addEventListener('resize', measureNav);
        window.addEventListener('load', measureNav);

        /* =========================================================
           Lightbox — every photo on the page that asked for one, in
           the order they appear.
           ========================================================= */
        var lbItems = [];
        var lbIndex = 0;
        var lightbox = document.getElementById('lightbox');

        function collectLightbox() {
            lbItems = Array.prototype.slice.call(document.querySelectorAll('[data-lb-src]'))
                .map(function (el) {
                    return { src: el.dataset.lbSrc, title: el.dataset.lbTitle || '', desc: el.dataset.lbDesc || '' };
                });
        }
        document.addEventListener('click', function (e) {
            var t = e.target.closest('[data-lb-src]');
            if (!t || EDIT) return;
            e.preventDefault();
            var all = Array.prototype.slice.call(document.querySelectorAll('[data-lb-src]'));
            openLightbox(all.indexOf(t));
        });
        function openLightbox(i) {
            if (i < 0 || !lbItems.length) return;
            lbIndex = i; paintLightbox();
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() { lightbox.classList.remove('open'); document.body.style.overflow = ''; }
        function stepLightbox(d) {
            if (!lbItems.length) return;
            lbIndex = (lbIndex + d + lbItems.length) % lbItems.length;
            paintLightbox();
        }
        function paintLightbox() {
            var it = lbItems[lbIndex];
            if (!it) return;
            document.getElementById('lbImg').src = it.src;
            document.getElementById('lbImg').alt = it.title;
            document.getElementById('lbTitle').textContent = it.title;
            document.getElementById('lbDesc').textContent = it.desc;
        }
        document.getElementById('lbClose').addEventListener('click', closeLightbox);
        document.getElementById('lbPrev').addEventListener('click', function () { stepLightbox(-1); });
        document.getElementById('lbNext').addEventListener('click', function () { stepLightbox(1); });
        lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', function (e) {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') stepLightbox(-1);
            if (e.key === 'ArrowRight') stepLightbox(1);
        });

        /* =========================================================
           Contact form -> api.php -> church inbox.
           Delegated, because a page may hold more than one form and
           they are drawn fresh on every render.
           ========================================================= */
        document.addEventListener('submit', function (e) {
            var form = e.target.closest('.js-contact-form');
            if (!form) return;
            e.preventDefault();
            if (EDIT) return;

            var btn    = form.querySelector('.form-submit');
            var status = form.querySelector('.form-status');
            var get = function (name) {
                var el = form.querySelector('[name="' + name + '"]');
                return el ? el.value.trim() : '';
            };

            var payload = {
                action: 'contact',
                name: get('name'), email: get('email'),
                subject: get('subject'), message: get('message'), website: get('website')
            };

            if (!payload.name || !payload.email || !payload.message) {
                status.className = 'form-status err';
                status.innerHTML = '<i class="fas fa-circle-exclamation"></i> Please fill in your name, email and message.';
                return;
            }

            var label = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending…';
            status.className = 'form-status';
            status.textContent = '';

            fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function (r) {
                return r.json().then(function (j) { return { ok: r.ok, body: j }; });
            }).then(function (res) {
                btn.disabled = false;
                btn.innerHTML = label;
                if (res.ok && res.body.ok) {
                    form.reset();
                    status.className = 'form-status ok';
                    status.innerHTML = '<i class="fas fa-circle-check"></i> Thank you — your message is on its way. We\'ll be in touch soon.';
                } else {
                    status.className = 'form-status err';
                    status.innerHTML = '<i class="fas fa-circle-exclamation"></i> ' +
                        esc((res.body && res.body.error) || 'Something went wrong. Please try again.');
                }
            }).catch(function () {
                btn.disabled = false;
                btn.innerHTML = label;
                status.className = 'form-status err';
                status.innerHTML = '<i class="fas fa-circle-exclamation"></i> Could not reach the server. Please check your connection, or email us directly at ' +
                    esc(data.contact.email) + '.';
            });
        });

        /* =========================================================
           Talking to the CMS.

           The editor loads this page in a frame with ?edit=1 and pushes
           the work-in-progress content across, so what it shows is the
           real page rather than an approximation of it. Clicks inside
           the canvas are sent back the other way.
           ========================================================= */
        window.addEventListener('message', function (e) {
            if (e.source !== window.parent) return;
            if (e.origin !== window.location.origin) return;
            var msg = e.data;
            if (!msg || msg.type !== 'wesley-preview') return;

            if (msg.content) data = SITE.normalise(msg.content);
            if (msg.pageId !== undefined) forcedPageId = msg.pageId;
            if (msg.selected !== undefined) selected = msg.selected;

            var keepScroll = window.scrollY;
            renderAll();
            if (msg.keepScroll !== false) window.scrollTo(0, keepScroll);
            if (msg.scrollTo) scrollToPart(msg.scrollTo);
        });

        function scrollToPart(id) {
            var el = document.querySelector('[data-id="' + id + '"]');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function toParent(msg) {
            if (window.parent === window) return;
            window.parent.postMessage(msg, window.location.origin);
        }

        /* =========================================================
           LOAD CONTENT — cache first so nothing flashes blank,
           then the authoritative copy from the server.
           ========================================================= */
        /* Something went so wrong that there is nothing to show. Say so on
           the page: a blank white screen tells whoever deployed the site
           nothing, and this is the one moment they most need telling. */
        function fatal(title, detail) {
            document.body.innerHTML =
                '<div style="font-family:system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:2rem;' +
                'background:#FFFDF7;border:1px solid #E2DCCC;border-radius:16px;color:#201C17;line-height:1.6">' +
                '<h1 style="font-size:1.25rem;margin-bottom:0.6rem">' + esc(title) + '</h1>' +
                '<p style="color:#6E6656">' + detail + '</p></div>';
        }

        /* index.html is only the shell — the site is drawn by three script
           files and a stylesheet, and they only work as a matching set.

           Two things go wrong when a site is updated by hand, and both used
           to surface as a blank page or a cryptic "x is not a function":
             - a NEW file never gets uploaded, because a File Manager upload
               only replaces the files already there;
             - an EXISTING file is replaced but the browser or the host keeps
               serving its cached copy.
           Each script reports the version it belongs to, so both cases can be
           named precisely instead of guessed at. */
        var NEEDS_VERSION = 2;

        function checkParts() {
            var missing = [], stale = [];
            [['blocks.js', 'BLOCKS'], ['content.js', 'SITE'], ['render.js', 'RENDER']]
                .forEach(function (p) {
                    var mod = window[p[1]];
                    if (!mod) missing.push(p[0]);
                    else if (mod.apiVersion !== NEEDS_VERSION) stale.push(p[0]);
                });
            return { missing: missing, stale: stale };
        }

        (function init() {
            var parts = checkParts();
            if (parts.missing.length || parts.stale.length) {
                var lines = [];
                if (parts.missing.length) {
                    lines.push('<strong>Did not load at all:</strong> ' + esc(parts.missing.join(', ')) +
                        ' — these are newer files, so an upload that only replaces what was already ' +
                        'on the server will skip them.');
                }
                if (parts.stale.length) {
                    lines.push('<strong>An out-of-date copy is being served:</strong> ' +
                        esc(parts.stale.join(', ')) + ' — upload the current version, then reload with ' +
                        '<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> ' +
                        '(<kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> on a Mac) to get past the cache.');
                }
                fatal('The website’s files do not match',
                    lines.join('<br><br>') +
                    '<br><br>Upload <code>index.html</code>, <code>admin.html</code>, <code>blocks.js</code>, ' +
                    '<code>content.js</code>, <code>render.js</code> and <code>theme.css</code> together — ' +
                    'they are one set.<br><br>Your content is safe: it lives in the database, not in these files.');
                return;
            }

            data = SITE.normalise(null);

            if (EDIT) {
                document.body.classList.add('is-editing');
                RENDER.editRuntime(document, toParent);
            }

            try {
                var cached = localStorage.getItem(CACHE_KEY);
                if (cached && !EDIT) data = SITE.normalise(JSON.parse(cached));
            } catch (e) {
                // A stale or corrupt cache must never be the reason the site
                // looks broken — drop it and carry on to the server copy.
                try { localStorage.removeItem(CACHE_KEY); } catch (e2) {}
                data = SITE.normalise(null);
            }

            try {
                renderAll();
            } catch (e) {
                fatal('The website could not be drawn', esc(e.message));
                return;
            }

            if (EDIT) { toParent({ type: 'wesley-ready' }); return; }

            fetch(API + '?action=content', { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error('no server'); return r.json(); })
                .then(function (j) {
                    if (!j || !j.content) return;   // a site with nothing saved yet
                    // Deliberately outside the catch below: if the saved
                    // content cannot be understood we must NOT quietly leave
                    // the built-in sample text on screen looking like the real
                    // site. That is indistinguishable from "all our content
                    // disappeared", which is the worst thing this page can do.
                    var next;
                    try {
                        next = SITE.normalise(j.content);
                    } catch (e) {
                        fatal('The saved content could not be read',
                            'The website is fine and nothing has been lost — the copy in the database ' +
                            'could not be understood by this version of the site.<br><br>' +
                            'Sign in at <a href="/admin">/admin</a> and use <strong>History</strong> to ' +
                            'restore the previous version.<br><br><code>' + esc(e.message) + '</code>');
                        return;
                    }
                    data = next;
                    try { localStorage.setItem(CACHE_KEY, JSON.stringify(j.content)); } catch (e) {}
                    renderAll();
                    // A link to #something on a freshly loaded page only
                    // works once that part actually exists.
                    if (location.hash) {
                        var target = document.querySelector(location.hash);
                        if (target) target.scrollIntoView();
                    }
                })
                .catch(function () { /* opened as a file or server down: show what we have */ });
        })();
    </script>
</body>
</html>
