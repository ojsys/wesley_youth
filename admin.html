/* =====================================================================
   EVENT WIRING — delegated across the whole editor
   ===================================================================== */
var main = $('main');

/* Typing into any bound input. */
main.addEventListener('input', function (e) {
    var el = e.target.closest('[data-bind]');
    if (el) { bindInput(el); return; }

    var rich = e.target.closest('[data-rich]');
    if (rich) {
        setPath(rich.dataset.rich, rich.innerHTML);
        markDirty();
    }
});

function bindInput(el) {
    var path = el.dataset.bind, val;

    if (el.dataset.type === 'bool')      val = el.checked;
    else if (el.dataset.type === 'num')  val = Number(el.value);
    else if (el.dataset.type === 'list') val = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    else                                 val = el.value;

    setPath(path, val);
    markDirty();

    var out = main.querySelector('[data-range-out="' + cssEscape(path) + '"]');
    if (out) out.textContent = el.value;

    if (el.dataset.image) {
        var thumb = main.querySelector('[data-thumb="' + cssEscape(path) + '"]');
        if (thumb) {
            thumb.style.backgroundImage = el.value ? "url('" + el.value.replace(/'/g, '%27') + "')" : '';
            thumb.innerHTML = el.value ? '' : '<i class="fas fa-image"></i>';
        }
    }
    if (el.dataset.colourText) {
        var swatch = main.querySelector('[data-colour="' + cssEscape(path) + '"]');
        if (swatch && /^#[0-9a-f]{6}$/i.test(el.value)) swatch.value = el.value;
    }
    if (el.dataset.iconText) paintIconPreview(path, el.value);

    // The header of a repeatable item shows its title — keep it in step.
    var item = el.closest('.item');
    if (item && /\.(title|label|text|number)$/.test(path)) {
        var t = item.querySelector('.item-head .title');
        if (t) t.textContent = el.value || 'Untitled';
    }
}

/* Attribute selectors choke on the dots in our paths only when a value is
   unquoted; quoting is enough, but ids from BLOCKS.uid can contain nothing
   exotic anyway. This keeps the quoting honest. */
function cssEscape(s) { return String(s).replace(/"/g, '\\"'); }

function paintIconPreview(path, value) {
    var box = main.querySelector('[data-icon-preview="' + cssEscape(path) + '"]');
    if (!box) return;
    var shown = value && !/^fa[srlbdt]\s/.test(value) ? 'fas ' + value : value;
    box.innerHTML = value ? '<i class="' + esc(shown) + '"></i>' : '<i class="fas fa-question" style="opacity:0.3"></i>';
}

/* Media library alt text / caption: these describe the photo itself, not the
   page, so they save straight away rather than waiting for Publish. */
main.addEventListener('change', function (e) {
    var f = e.target.closest('[data-media-field]');
    if (!f) return;
    var parts = f.dataset.mediaField.split(':');
    var id = Number(parts[1]);
    var row = media.filter(function (m) { return m.id === id; })[0];
    if (!row) return;
    row[parts[0]] = f.value;
    api('media_update', { id: id, alt_text: row.alt_text || '', caption: row.caption || '' })
        .then(function () { toast('Saved.'); })
        .catch(function (err) { toast(err.message, true); });
});

main.addEventListener('change', function (e) {
    var swatch = e.target.closest('[data-colour]');
    if (swatch) {
        setPath(swatch.dataset.colour, swatch.value);
        var text = main.querySelector('[data-colour-text="' + cssEscape(swatch.dataset.colour) + '"]');
        if (text) text.value = swatch.value;
        markDirty();
        return;
    }

    var el = e.target.closest('[data-bind]');
    if (!el || el.tagName !== 'SELECT') return;
    // Apply the choice here too — not every browser fires `input` on a
    // <select> — then redraw, because a choice can change which fields are
    // relevant (a row's layout changes how many columns it has, for one).
    setPath(el.dataset.bind, el.value);

    if (/\.layout$/.test(el.dataset.bind)) relayoutRow(el.dataset.bind);

    markDirty();
    redrawEditor();
});

/* Changing a row's layout adds or removes columns to match. */
function relayoutRow(layoutPath) {
    var rowPath = layoutPath.replace(/\.layout$/, '');
    var row = getPath(rowPath);
    if (!row) return;
    var spec = BLOCKS.layout(row.layout);
    var cols = row.columns || [];

    while (cols.length < spec.cols.length) cols.push(BLOCKS.newColumn([]));
    if (cols.length > spec.cols.length) {
        // Never throw content away: fold the extra columns into the last one.
        var keep = cols.slice(0, spec.cols.length);
        cols.slice(spec.cols.length).forEach(function (extra) {
            keep[keep.length - 1].elements = keep[keep.length - 1].elements.concat(extra.elements);
        });
        cols = keep;
    }
    cols.forEach(function (c, i) { c.width = spec.cols[i]; });
    row.columns = cols;
}

/* Redraw whichever editing surface is on screen. */
function redrawEditor() {
    if (screenId === 'pages') { paintPages(); paintInspector(); pushPreview(); }
    else render();
}

main.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-add],[data-add-item],[data-dup-item],[data-del],[data-move],' +
        '[data-pick],[data-clear],[data-add-social],[data-msg-toggle],[data-msg-del],[data-msg-unread],' +
        '[data-media-del],[data-copy],[data-restore],[data-select],[data-bd],[data-add-section],' +
        '[data-add-element],[data-add-row],[data-del-page],[data-set-home],[data-open-page],' +
        '[data-icon-pick],[data-rte]');
    if (!t) return;
    var d = t.dataset;

    if (d.rte !== undefined) { e.preventDefault(); richCommand(t); return; }
    if (d.go)   { e.preventDefault(); go(d.go); return; }
    if (d.pick) { openPicker(d.pick); return; }
    if (d.iconPick) { openIconPicker(d.iconPick); return; }
    if (d.clear) { setPath(d.clear, ''); markDirty(); redrawEditor(); return; }

    /* ---- builder ---- */
    if (d.select !== undefined) {
        selection = d.select ? { kind: 'unknown', id: d.select } : null;
        paintInspector();
        pushPreview(d.select ? { scrollTo: d.select } : {});
        return;
    }
    if (d.bd) {
        var bits = d.bd.split(':');
        builderAction(bits[0], bits[1], bits[2]);
        return;
    }
    if (d.addSection) { chooseSection(d.addSection); return; }
    if (d.addElement) { chooseElement(d.addElement); return; }
    if (d.addRow)     { addRow(d.addRow); return; }
    if (d.delPage)    { deletePage(d.delPage); return; }
    if (d.setHome)    { setHome(d.setHome); return; }
    if (d.openPage)   { pageId = d.openPage; selection = null; go('pages'); return; }

    /* ---- repeatable lists ---- */
    if (d.add) {
        var arr = getPath(d.add) || [];
        arr.push(newItemFor(d.add));
        markDirty(); redrawEditor();
        return;
    }
    if (d.addItem) {
        var list = getPath(d.addItem) || [];
        var def = ITEM_DEFS[d.addItem];
        var fresh = def ? BLOCKS.stampListIds(clone(def.defaults || {})) : {};
        if (!fresh.id) fresh.id = BLOCKS.uid();
        list.push(fresh);
        markDirty(); redrawEditor();
        return;
    }
    if (d.dupItem) {
        var dp = d.dupItem.split(':');
        var dupList = getPath(dp[0]);
        var copy = withNewIds(clone(dupList[Number(dp[1])]));
        dupList.splice(Number(dp[1]) + 1, 0, copy);
        markDirty(); redrawEditor();
        return;
    }
    if (d.del) {
        var parts = d.del.split(':');
        confirmAction('Delete this item?', 'It will be gone from the editor. Nothing changes on the live website until you publish.', function () {
            getPath(parts[0]).splice(Number(parts[1]), 1);
            markDirty(); redrawEditor();
        });
        return;
    }
    if (d.move) {
        var m = d.move.split(':');
        var mlist = getPath(m[0]), i = Number(m[1]), to = i + Number(m[2]);
        if (to < 0 || to >= mlist.length) return;
        mlist.splice(to, 0, mlist.splice(i, 1)[0]);
        markDirty(); redrawEditor();
        return;
    }
    if (d.addSocial) {
        var sel = $('socialPreset');
        var preset = SITE.socialPresets[Number(sel.value)] || SITE.socialPresets[0];
        content.contact.socials.push({ id: BLOCKS.uid(), label: preset.label, icon: preset.icon, url: preset.url });
        markDirty(); redrawEditor();
        return;
    }

    /* ---- messages / media / history ---- */
    if (d.msgToggle) {
        var box = $('msgbody_' + d.msgToggle);
        box.classList.toggle('hidden');
        if (!box.classList.contains('hidden')) {
            api('message_read', { id: Number(d.msgToggle) }).then(function () {
                var msg = messages.filter(function (x) { return x.id === Number(d.msgToggle); })[0];
                if (msg) msg.is_read = 1;
                refreshStats();
            }).catch(function () {});
        }
        return;
    }
    if (d.msgUnread) {
        api('message_read', { id: Number(d.msgUnread), unread: 1 })
            .then(function () { loadMessages(); refreshStats(); }).catch(function (x) { toast(x.message, true); });
        return;
    }
    if (d.msgDel) {
        confirmAction('Delete this message?', 'This cannot be undone.', function () {
            api('message_delete', { id: Number(d.msgDel) })
                .then(function () { loadMessages(); refreshStats(); toast('Message deleted.'); })
                .catch(function (x) { toast(x.message, true); });
        });
        return;
    }
    if (d.mediaDel) {
        e.stopPropagation();
        confirmAction('Delete this photo?', 'If it is used anywhere on the website that spot will go blank.', function () {
            api('media_delete', { name: d.mediaDel })
                .then(function () { loadMedia(); toast('Photo deleted.'); })
                .catch(function (x) { toast(x.message, true); });
        });
        return;
    }
    if (d.copy) {
        navigator.clipboard ? navigator.clipboard.writeText(d.copy).then(function () { toast('Link copied.'); })
                            : toast(d.copy);
        return;
    }
    if (d.restore) {
        confirmAction('Restore this version?', 'The website goes back to how it was then. Your current version is saved first, so you can undo this.', function () {
            api('revision_restore', { id: Number(d.restore) }).then(function (j) {
                content = SITE.normalise(j.content);
                published = clone(content);
                pageId = (SITE.homePage(content) || {}).id;
                selection = null;
                markClean();
                loadHistory(); reloadPreview();
                if (screenId === 'pages') { $('main').innerHTML = ''; render(); }
                toast('That version has been restored and is live.');
            }).catch(function (x) { toast(x.message, true); });
        });
        return;
    }
});

/* Rich text toolbar. */
function richCommand(btn) {
    var box = btn.closest('.rte').querySelector('[data-rich]');
    box.focus();
    var cmd = btn.dataset.rte;

    if (cmd === 'bold')   document.execCommand('bold');
    if (cmd === 'italic') document.execCommand('italic');
    if (cmd === 'ul')     document.execCommand('insertUnorderedList');
    if (cmd === 'ol')     document.execCommand('insertOrderedList');
    if (cmd === 'h2')     document.execCommand('formatBlock', false, 'h3');
    if (cmd === 'quote')  document.execCommand('formatBlock', false, 'blockquote');
    if (cmd === 'clear')  { document.execCommand('removeFormat'); document.execCommand('formatBlock', false, 'p'); }
    if (cmd === 'link') {
        var url = window.prompt('Where should this link go?\n\nA page on this site (/about), a jump within the page (#vision), or a full web address.', 'https://');
        if (url) document.execCommand('createLink', false, url);
    }

    setPath(box.dataset.rich, box.innerHTML);
    markDirty();
}

/* What a freshly added item looks like, for the lists outside the builder. */
function newItemFor(arrayPath) {
    if (arrayPath === 'nav.links') return { id: BLOCKS.uid(), label: 'New link', href: '#', pageId: '' };
    return { id: BLOCKS.uid() };
}

/* ---------------------------------------------------------------------
   Media picker
   --------------------------------------------------------------------- */
var pickTarget = null;
function openPicker(path) {
    pickTarget = path;
    $('mediaModal').classList.add('open');
    paintPicker();
    loadMedia();
}
function paintPicker() {
    $('pickGrid').innerHTML = media.length
        ? media.map(function (m) {
            return '<div class="media-tile" data-choose="' + esc(m.url) + '">' +
                '<img src="' + esc(m.url) + '" alt="" loading="lazy">' +
                '<div class="meta">' + esc(m.name) + '</div></div>';
          }).join('')
        : '<p class="empty" style="grid-column:1/-1">Nothing uploaded yet — drop a photo above to get started.</p>';
}
$('pickGrid').addEventListener('click', function (e) {
    var tile = e.target.closest('[data-choose]');
    if (!tile || !pickTarget) return;
    chooseImage(tile.dataset.choose);
});
function chooseImage(url) {
    if (!pickTarget) return;
    setPath(pickTarget, url);

    // Reuse whatever was written about this photo in the media library, so
    // a gallery entry arrives with its words already filled in.
    var row = media.filter(function (m) { return m.url === url; })[0];
    if (row) {
        var holderPath = pickTarget.replace(/\.[^.]+$/, '');
        var holder = getPath(holderPath);
        if (holder && typeof holder === 'object') {
            if ('title' in holder && !holder.title && row.caption)  holder.title = row.caption;
            if ('desc'  in holder && !holder.desc  && row.alt_text) holder.desc  = row.alt_text;
            if ('alt'   in holder && !holder.alt   && row.alt_text) holder.alt   = row.alt_text;
        }
    }

    pickTarget = null;
    markDirty();
    closeModals();
    redrawEditor();
    toast('Photo added.');
}

/* ---------------------------------------------------------------------
   Icon picker
   --------------------------------------------------------------------- */
var iconTarget = null;
function openIconPicker(path) {
    iconTarget = path;
    $('iconBody').innerHTML = BLOCKS.icons.map(function (g) {
        return '<div class="blk-group">' + esc(g.group) + '</div><div class="icon-grid">' +
            g.names.map(function (n) {
                return '<button class="icon-opt" data-icon="' + esc(n) + '" title="' + esc(n) + '">' +
                       '<i class="fas ' + esc(n) + '"></i></button>';
            }).join('') + '</div>';
    }).join('') +
    '<p style="color:var(--muted);font-size:0.82rem;margin-top:1rem">' +

/* ---------------------------------------------------------------------
   Uploading
   --------------------------------------------------------------------- */
function uploadFiles(files, onEach) {
    var list = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
    if (!list.length) { toast('Please choose image files.', true); return; }

    var done = 0;
    toast('Uploading ' + list.length + ' photo' + (list.length > 1 ? 's' : '') + '…');
    list.forEach(function (f) {
        var fd = new FormData();
        fd.append('action', 'upload');
        fd.append('token', token);
        fd.append('file', f);
        fetch(API + '?action=upload', { method: 'POST', body: fd })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                if (!res.ok || !res.j.ok) throw new Error(res.j.error || 'Upload failed.');
                done++;
                if (onEach) onEach(res.j.url);
                if (done === list.length) { toast('Uploaded.'); loadMedia(); }
            })
            .catch(function (err) { toast(err.message, true); });
    });
}

function wireDrop(zoneId, inputId, onUrl) {
    var zone = $(zoneId), input = $(inputId);
    if (!zone) return;
    ['dragenter', 'dragover'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('over'); });
    });
    zone.addEventListener('drop', function (e) { uploadFiles(e.dataTransfer.files, onUrl); });
    if (input) input.addEventListener('change', function () { uploadFiles(input.files, onUrl); input.value = ''; });
}
wireDrop('pickDrop', 'pickFile', function (url) {
    // The first upload fills the field being edited; the rest simply join
    // the library, ready to be picked.
    if (pickTarget) chooseImage(url);
});

function wireHistory() {
    $('backupBtn').addEventListener('click', function () {

        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'wesley-website-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);

$('restoreFile').addEventListener('change', function (e) {

            render();
            toast('Backup loaded into the editor — press Publish changes to make it live.');

    };

    e.target.value = '';
});

/* ---------------------------------------------------------------------
   Start
   --------------------------------------------------------------------- */
(function () {
    // The editor is built on blocks.js and content.js, and they only work as a
    // matching set. Name a missing or out-of-date one rather than failing in a
    // dozen confusing ways later. (Same check as index.html.)
    var NEEDS_VERSION = 2;
    var missing = [], stale = [];
    [['blocks.js', 'BLOCKS'], ['content.js', 'SITE']].forEach(function (p) {
        var mod = window[p[1]];
        if (!mod) missing.push(p[0]);
        else if (mod.apiVersion !== NEEDS_VERSION) stale.push(p[0]);
    });
    if (missing.length || stale.length) {
        document.body.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:2rem;' +
            'background:#fff;border-radius:16px;line-height:1.6">' +
            '<h1 style="font-size:1.25rem;margin-bottom:0.6rem">The Website Manager’s files do not match</h1>' +
            '<p style="color:#7A7263">' +
            (missing.length ? '<strong>Did not load:</strong> ' + missing.join(', ') + '.<br><br>' : '') +
            (stale.length ? '<strong>Out of date on the server:</strong> ' + stale.join(', ') +
                ' — upload the current version and reload with Ctrl+Shift+R (Cmd+Shift+R on a Mac).<br><br>' : '') +
            'Upload <code>index.html</code>, <code>admin.html</code>, <code>blocks.js</code>, ' +
            '<code>content.js</code>, <code>render.js</code> and <code>theme.css</code> together.<br><br>' +
            'Nothing has been lost — your content is in the database.</p></div>';
        return;
    }

    try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
    if (!token) { $('pw').focus(); return; }
    // Check the saved session is still good before showing the editor.
    fetch(API + '?action=ping&token=' + encodeURIComponent(token))
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.authed) startApp(); else signOut(false); })
        .catch(function () { signOut(false); });
})();
</script>
</body>
</html>
