<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Website Manager — First UMC &amp; Wesley Foundation</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #F2B705;
            --gold-light: #FBCB2E;
            --gold-deep: #D99A00;
            --ink: #141210;
            --ink-2: #1E1A15;
            --ink-3: #2A251E;
            --cream: #FBF6E9;
            --paper: #FFFFFF;
            --bg: #F3F0E8;
            --text: #201C17;
            --muted: #7A7263;
            --line: #E2DCCC;
            --ok: #2F7D32;
            --warn: #B8791B;
            --danger: #C0392B;
            --topbar: 62px;
            --sidebar: 248px;
            --rail: 214px;
            --inspector: 340px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Barlow', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.55; -webkit-font-smoothing: antialiased;
        }
        h1,h2,h3,h4 { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.3px; }
        a { color: var(--gold-deep); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #cdc6b4; border-radius: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* =========== Sign in =========== */
        .login-screen {
            position: fixed; inset: 0; z-index: 900;
            display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            background: radial-gradient(900px 600px at 50% -10%, #2a2419, var(--ink));
        }
        .login-card {
            width: 380px; max-width: 100%; background: var(--paper);
            border-radius: 18px; padding: 2.4rem 2.2rem;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        }
        .login-mark {
            width: 62px; height: 62px; border-radius: 18px; background: var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--ink); margin: 0 auto 1.2rem;
        }
        .login-card h1 { text-align: center; font-size: 1.35rem; text-transform: uppercase; }
        .login-card p.sub { text-align: center; color: var(--muted); font-size: 0.92rem; margin-bottom: 1.6rem; }
        .login-card label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 700; color: var(--muted); margin-bottom: 0.4rem; }
        .login-card input {
            width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--line);
            border-radius: 10px; font-size: 1rem; font-family: inherit; background: #FBFAF6;
        }
        .login-card input:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(242,183,5,0.25); }
        .login-card button {
            width: 100%; margin-top: 1.1rem; padding: 0.9rem; border: none; border-radius: 10px;
            background: var(--ink); color: var(--gold-light); font-family: 'Oswald', sans-serif;
            font-size: 0.95rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; cursor: pointer;
        }
        .login-card button:hover { background: var(--gold); color: var(--ink); }
        .login-err { color: var(--danger); font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.6rem; text-align: center; }
        .login-foot { text-align: center; margin-top: 1.4rem; font-size: 0.82rem; color: var(--muted); }

        /* =========== App shell =========== */
        .app { display: none; }
        .app.ready { display: block; }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--topbar); z-index: 300;
            background: var(--ink); color: var(--cream);
            display: flex; align-items: center; gap: 1rem; padding: 0 1rem 0 1.1rem;
        }
        .topbar .logo { display: flex; align-items: center; gap: 0.65rem; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }
        .topbar .logo i { color: var(--gold); font-size: 1.15rem; }
        .topbar .spacer { flex: 1; }
        .tb-btn {
            background: rgba(255,255,255,0.08); color: var(--cream); border: 1px solid rgba(255,255,255,0.14);
            padding: 0.5rem 0.85rem; border-radius: 9px; cursor: pointer; font-size: 0.82rem;
            font-family: 'Oswald', sans-serif; letter-spacing: 0.8px; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 0.45rem; text-decoration: none; white-space: nowrap;
        }
        .tb-btn:hover { background: rgba(255,255,255,0.16); }
        .tb-btn.primary { background: var(--gold); color: var(--ink); border-color: transparent; font-weight: 700; }
        .tb-btn.primary:hover { background: var(--gold-light); }
        .tb-btn[disabled] { opacity: 0.45; cursor: default; }
        .dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: none; }
        .is-dirty .dirty-dot { display: inline-block; }
        .save-state { font-size: 0.8rem; color: rgba(251,246,233,0.6); display: flex; align-items: center; gap: 0.45rem; }
        .menu-btn { display: none; background: none; border: none; color: var(--cream); font-size: 1.2rem; cursor: pointer; }

        .sidebar {
            position: fixed; top: var(--topbar); bottom: 0; left: 0; width: var(--sidebar); z-index: 250;
            background: var(--ink-2); color: rgba(251,246,233,0.75); overflow-y: auto; padding: 0.9rem 0 3rem;
        }
        .side-group { padding: 1.1rem 1.2rem 0.4rem; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(251,246,233,0.35); font-weight: 700; }
        .side-item {
            display: flex; align-items: center; gap: 0.75rem; width: 100%;
            padding: 0.62rem 1.2rem; background: none; border: none; cursor: pointer;
            color: inherit; font-family: 'Barlow', sans-serif; font-size: 0.93rem; text-align: left;
            border-left: 3px solid transparent;
        }
        .side-item i { width: 18px; text-align: center; color: rgba(251,203,46,0.75); font-size: 0.95rem; }
        .side-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .side-item.active { background: rgba(242,183,5,0.14); border-left-color: var(--gold); color: #fff; font-weight: 600; }
        .side-item .badge {
            margin-left: auto; background: var(--danger); color: #fff; border-radius: 20px;
            font-size: 0.68rem; padding: 0.05rem 0.45rem; font-weight: 700;
        }

        .main { margin: var(--topbar) 0 0 var(--sidebar); padding: 1.6rem 1.8rem 5rem; transition: margin-right 0.3s; }
        .main.with-preview { margin-right: 420px; }
        /* The builder fills the window instead of scrolling as a document. */
        .main.is-builder { padding: 0; height: calc(100vh - var(--topbar)); overflow: hidden; margin-right: 0; }
        .page-head { margin-bottom: 1.4rem; }
        .page-head h2 { font-size: 1.5rem; text-transform: uppercase; }
        .page-head p { color: var(--muted); font-size: 0.95rem; max-width: 70ch; }

        /* =========== Cards & fields =========== */
        .card {
            background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
            padding: 1.4rem 1.5rem; margin-bottom: 1.1rem; max-width: 940px;
        }
        .card > h3 {
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.2px;
            padding-bottom: 0.75rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 0.55rem;
        }
        .card > h3 i { color: var(--gold-deep); }
        .card > h3 .h3-note { margin-left: auto; font-family: 'Barlow'; text-transform: none; letter-spacing: 0; font-size: 0.8rem; color: var(--muted); font-weight: 400; }

        .fld { margin-bottom: 1rem; }
        .fld > label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; color: var(--muted); margin-bottom: 0.35rem; }
        .fld input[type=text], .fld input[type=email], .fld input[type=url], .fld input[type=password], .fld textarea, .fld select {
            width: 100%; padding: 0.62rem 0.75rem; border: 1px solid var(--line); border-radius: 9px;
            font-family: inherit; font-size: 0.95rem; background: #FCFBF7; color: var(--text);
        }
        .fld textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
        .fld input:focus, .fld textarea:focus, .fld select:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(242,183,5,0.2); }
        .fld .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
        .fld-note {
            font-size: 0.82rem; color: var(--muted); background: #FAF7EE; border: 1px solid var(--line);
            border-radius: 9px; padding: 0.6rem 0.75rem; margin-bottom: 0.9rem;
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 1rem; }
        @media (max-width: 700px) { .row, .row-3 { grid-template-columns: 1fr; } }

        .check { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.9rem; }
        .check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--gold-deep); flex-shrink: 0; }
        .check span { font-size: 0.92rem; }
        .check .hint { display: block; color: var(--muted); font-size: 0.82rem; }

        .fld input[type=range] { width: 100%; accent-color: var(--gold-deep); }

        /* image picker */
        .img-field { display: flex; gap: 0.75rem; align-items: center; }
        .img-thumb {
            width: 74px; height: 58px; border-radius: 9px; background-size: cover; background-position: center;
            border: 1px solid var(--line); background-color: #EDE8DA; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; color: #B9AF95; font-size: 1.1rem;
        }
        .img-actions { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 0; }
        .img-buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; }

        /* colour + icon pickers */
        .colour-field { display: flex; gap: 0.5rem; align-items: center; }
        .colour-field input[type=color] { width: 46px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: #FCFBF7; cursor: pointer; }
        .icon-field { display: flex; gap: 0.5rem; align-items: center; }
        .icon-preview {
            width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line);
            background: #FCFBF7; display: flex; align-items: center; justify-content: center;
            color: var(--gold-deep); flex-shrink: 0;
        }

        .btn {
            border: 1px solid var(--line); background: #FAF8F1; color: var(--text);
            padding: 0.5rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            font-family: inherit; display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap;
        }
        .btn:hover { background: #F1ECDD; border-color: #D2C9B0; }
        .btn.gold { background: var(--gold); border-color: transparent; font-weight: 600; }
        .btn.gold:hover { background: var(--gold-light); }
        .btn.dark { background: var(--ink); color: var(--gold-light); border-color: transparent; }
        .btn.dark:hover { background: var(--ink-3); }
        .btn.danger { color: var(--danger); border-color: #E8C9C4; background: #FDF4F3; }
        .btn.danger:hover { background: #F9E5E2; }
        .btn.tiny { padding: 0.3rem 0.5rem; font-size: 0.78rem; }
        .btn.block { width: 100%; justify-content: center; }
        .btn[disabled] { opacity: 0.5; cursor: default; }

        /* repeatable items */
        .item {
            border: 1px solid var(--line); border-radius: 12px; margin-bottom: 0.9rem;
            background: #FCFBF7; overflow: hidden;
        }
        .item-head {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem;
            background: #F5F1E5; border-bottom: 1px solid var(--line);
        }
        .item-head .num {
            width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--gold-light);
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
        }
        .item-head .thumb { width: 30px; height: 24px; border-radius: 5px; background-size: cover; background-position: center; background-color: #EDE8DA; flex-shrink: 0; }
        .item-head .title {
            font-family: 'Oswald', sans-serif; font-size: 0.9rem; letter-spacing: 0.4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .item-body { padding: 1rem 0.9rem 0.3rem; }
        .item-body.collapsed { display: none; }
        .add-row { margin-top: 0.3rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

        .empty { color: var(--muted); font-size: 0.92rem; padding: 1rem 0; text-align: center; }

        /* collapsible group inside the inspector */
        .grp { border: 1px solid var(--line); border-radius: 11px; margin-bottom: 0.8rem; background: #FCFBF7; }
        .grp > summary {
            cursor: pointer; list-style: none; padding: 0.65rem 0.8rem;
            font-family: 'Oswald', sans-serif; font-size: 0.8rem; text-transform: uppercase;
            letter-spacing: 1px; display: flex; align-items: center; gap: 0.5rem;
        }
        .grp > summary::-webkit-details-marker { display: none; }
        .grp > summary::after { content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900; margin-left: auto; font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; }
        .grp[open] > summary::after { transform: rotate(180deg); }
        .grp-body { padding: 0.3rem 0.8rem 0.1rem; border-top: 1px solid var(--line); }

        /* =========== The builder =========== */
        .builder { display: flex; height: 100%; }

        .bd-rail {
            width: var(--rail); flex-shrink: 0; background: var(--paper);
            border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
        }
        .bd-rail-head, .bd-inspect-head {
            padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--line);
            font-family: 'Oswald', sans-serif; font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1.4px; color: var(--muted); display: flex; align-items: center; gap: 0.5rem;
        }
        .bd-rail-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .bd-rail-foot { padding: 0.6rem; border-top: 1px solid var(--line); }
        .pg {
            display: flex; align-items: center; gap: 0.5rem; width: 100%; text-align: left;
            padding: 0.55rem 0.6rem; border: 1px solid transparent; border-radius: 9px;
            background: none; cursor: pointer; font-family: inherit; font-size: 0.9rem; color: var(--text);
        }
        .pg:hover { background: #F5F1E5; }
        .pg.active { background: rgba(242,183,5,0.16); border-color: var(--gold); font-weight: 600; }
        .pg i { color: var(--gold-deep); width: 15px; text-align: center; font-size: 0.85rem; }
        .pg .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pg .sl { font-size: 0.7rem; color: var(--muted); font-weight: 400; }

        .bd-canvas { flex: 1; min-width: 0; background: #DCD6C6; display: flex; flex-direction: column; }
        .bd-canvas-head {
            padding: 0.45rem 0.7rem; background: var(--paper); border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--muted);
        }
        .bd-canvas-wrap { flex: 1; display: flex; justify-content: center; overflow: hidden; padding: 0; }
        .bd-canvas iframe {
            width: 100%; height: 100%; border: none; background: #fff;
            transition: max-width 0.25s ease; margin: 0 auto;
        }
        .bd-canvas.w-tablet iframe { max-width: 820px; box-shadow: 0 0 0 1px var(--line); }
        .bd-canvas.w-phone iframe  { max-width: 420px; box-shadow: 0 0 0 1px var(--line); }
        .vw-btn { background: none; border: 1px solid transparent; border-radius: 7px; padding: 0.3rem 0.5rem; cursor: pointer; color: var(--muted); }
        .vw-btn.active { background: #F0EBDB; border-color: var(--line); color: var(--text); }

        .bd-inspect {
            width: var(--inspector); flex-shrink: 0; background: var(--paper);
            border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
        }
        .bd-inspect-body { flex: 1; overflow-y: auto; padding: 0.85rem; }
        .bd-inspect-body .fld { margin-bottom: 0.85rem; }
        .bd-crumb {
            display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap;
            padding: 0.5rem 0.85rem; background: #F8F5EC; border-bottom: 1px solid var(--line); font-size: 0.75rem;
        }
        .bd-crumb button { background: none; border: none; cursor: pointer; color: var(--gold-deep); font-family: inherit; font-size: 0.75rem; padding: 0; }
        .bd-crumb i { font-size: 0.55rem; color: var(--muted); }
        .bd-crumb .now { color: var(--text); font-weight: 600; }

        /* the outline of a page, shown when nothing is selected */
        .outline { list-style: none; }
        .out-item {
            display: flex; align-items: center; gap: 0.5rem; width: 100%;
            padding: 0.45rem 0.55rem; border: 1px solid var(--line); border-radius: 8px;
            background: #FCFBF7; cursor: pointer; margin-bottom: 0.35rem;
            font-family: inherit; font-size: 0.86rem; text-align: left; color: var(--text);
        }
        .out-item:hover { border-color: var(--gold-deep); }
        .out-item i { color: var(--gold-deep); width: 15px; text-align: center; font-size: 0.8rem; }
        .out-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .out-item.off { opacity: 0.5; }

        /* rich text editor */
        .rte { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #FCFBF7; }
        .rte-bar { display: flex; flex-wrap: wrap; gap: 2px; padding: 0.3rem; background: #F5F1E5; border-bottom: 1px solid var(--line); }
        .rte-bar button {
            width: 28px; height: 26px; border: none; background: none; border-radius: 5px; cursor: pointer;
            color: var(--text); font-size: 0.75rem; display: inline-flex; align-items: center; justify-content: center;
        }
        .rte-bar button:hover { background: #E4DCC6; }
        .rte-body { min-height: 110px; padding: 0.6rem 0.7rem; font-size: 0.93rem; outline: none; }
        .rte-body:focus { box-shadow: inset 0 0 0 2px rgba(242,183,5,0.35); }
        .rte-body p { margin: 0 0 0.6rem; }
        .rte-body ul, .rte-body ol { margin: 0 0 0.6rem 1.2rem; }
        .rte-body h2, .rte-body h3 { font-size: 1.05rem; margin-bottom: 0.4rem; }

        /* dashboard */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.9rem; max-width: 940px; margin-bottom: 1.1rem; }
        .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem; }
        .stat .n { font-family: 'Oswald', sans-serif; font-size: 1.9rem; line-height: 1; }
        .stat .l { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-top: 0.35rem; }
        .stat i { color: var(--gold-deep); float: right; font-size: 1.1rem; }
        .quick { display: flex; flex-wrap: wrap; gap: 0.6rem; }

        /* messages */
        .msg {
            border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
            margin-bottom: 0.7rem; overflow: hidden;
        }
        .msg.unread { border-left: 4px solid var(--gold); }
        .msg-head { display: flex; gap: 0.75rem; align-items: center; padding: 0.85rem 1rem; cursor: pointer; }
        .msg-head .who { font-weight: 600; }
        .msg-head .sub { color: var(--muted); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-head .when { margin-left: auto; color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
        .msg-body { padding: 0 1rem 1rem; border-top: 1px solid var(--line); }
        .msg-body.hidden { display: none; }
        .msg-body pre { white-space: pre-wrap; font-family: inherit; font-size: 0.95rem; margin: 0.9rem 0; }
        .msg-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .pill { font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
        .pill.warn { background: #FBEFD8; color: var(--warn); }
        .pill.ok { background: #E4F1E4; color: var(--ok); }

        /* media library */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; }
        .media-tile {
            border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--paper);
            cursor: pointer; position: relative;
        }
        .media-tile img { width: 100%; height: 118px; object-fit: cover; display: block; background: #EDE8DA; cursor: copy; }
        .media-tile .meta { padding: 0.45rem 0.55rem; font-size: 0.72rem; color: var(--muted); word-break: break-all; }
        .media-tile:hover { border-color: var(--gold-deep); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .media-in {
            width: 100%; margin-bottom: 0.3rem; padding: 0.3rem 0.4rem; font-family: inherit;
            font-size: 0.76rem; border: 1px solid var(--line); border-radius: 6px; background: #FCFBF7; color: var(--text);
        }
        .media-in:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 2px rgba(242,183,5,0.2); }
        .media-facts { display: block; font-size: 0.7rem; color: var(--muted); }
        .media-tile .del {
            position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.92);
            border: 1px solid var(--line); border-radius: 7px; width: 26px; height: 26px; cursor: pointer;
            color: var(--danger); display: none; align-items: center; justify-content: center; font-size: 0.75rem;
        }
        .media-tile:hover .del { display: flex; }
        .dropzone {
            border: 2px dashed #D5CDB6; border-radius: 12px; padding: 1.6rem; text-align: center;
            color: var(--muted); margin-bottom: 1.1rem; background: #FBFAF5;
        }
        .dropzone.over { border-color: var(--gold-deep); background: #FDF6E2; }

        /* preview panel (used by the site-wide screens) */
        .preview {
            position: fixed; top: var(--topbar); right: 0; bottom: 0; width: 420px; z-index: 200;
            background: #E9E4D6; border-left: 1px solid var(--line); display: none; flex-direction: column;
        }
        .preview.open { display: flex; }
        .preview-head { padding: 0.55rem 0.8rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--paper); }
        .preview iframe { flex: 1; width: 100%; border: none; background: #fff; }

        /* modal */
        .modal-back {
            position: fixed; inset: 0; background: rgba(20,18,16,0.55); z-index: 800;
            display: none; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .modal-back.open { display: flex; }
        .modal {
            background: var(--paper); border-radius: 16px; width: 760px; max-width: 100%;
            max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 30px 70px rgba(0,0,0,0.4);
        }
        .modal-head { padding: 1rem 1.2rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 0.6rem; }
        .modal-head h3 { font-size: 1rem; text-transform: uppercase; flex: 1; }
        .modal-body { padding: 1.2rem; overflow-y: auto; }
        .modal-foot { padding: 0.85rem 1.2rem; border-top: 1px solid var(--line); display: flex; gap: 0.5rem; justify-content: flex-end; }
        .modal.small { width: 420px; }
        .modal.wide { width: 900px; }

        /* the "add a block" chooser */
        .blk-group { font-family: 'Oswald', sans-serif; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.6px; color: var(--muted); margin: 1.1rem 0 0.6rem; }
        .blk-group:first-child { margin-top: 0; }
        .blk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 0.6rem; }
        .blk {
            border: 1px solid var(--line); border-radius: 11px; background: #FCFBF7; cursor: pointer;
            padding: 0.9rem 0.7rem; text-align: center; font-family: inherit; font-size: 0.82rem; color: var(--text);
            display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
        }
        .blk:hover { border-color: var(--gold-deep); background: #FDF8EA; transform: translateY(-2px); }
        .blk i { font-size: 1.25rem; color: var(--gold-deep); }

        /* the icon chooser */
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 0.4rem; }
        .icon-opt {
            aspect-ratio: 1; border: 1px solid var(--line); border-radius: 9px; background: #FCFBF7;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.05rem; color: var(--text);
        }
        .icon-opt:hover { border-color: var(--gold-deep); color: var(--gold-deep); background: #FDF8EA; }

        /* toast */
        .toast {
            position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(140px);
            background: var(--ink); color: var(--cream); padding: 0.8rem 1.3rem; border-radius: 50px;
            z-index: 1000; transition: transform 0.35s ease; display: flex; align-items: center; gap: 0.55rem;
            box-shadow: 0 14px 34px rgba(0,0,0,0.35); font-size: 0.92rem; max-width: 90vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.err { background: var(--danger); color: #fff; }
        .toast.ok i { color: var(--gold); }

        @media (max-width: 1400px) { :root { --inspector: 310px; --rail: 190px; } }
        @media (max-width: 1200px) {
            .bd-rail { display: none; }
        }
        @media (max-width: 1100px) { .main.with-preview { margin-right: 0; } .preview { width: 100%; } }
        @media (max-width: 900px) {
            .builder { flex-direction: column; }
            .bd-inspect { width: 100%; height: 46%; border-left: none; border-top: 1px solid var(--line); }
            .bd-canvas { height: 54%; }
        }
        @media (max-width: 860px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.25s; }
            .sidebar.open { transform: none; }
            .main { margin-left: 0; padding: 1.1rem 1rem 4rem; }
            .main.is-builder { padding: 0; }
            .menu-btn { display: block; }
            .topbar .logo span { display: none; }
        }
    </style>
</head>

<script src="blocks.js?v=2"></script>
<script src="content.js?v=2"></script>
<script>
/* =====================================================================
   Website Manager — the content management system for the
   First UMC & Wesley Foundation site.

   The website is a list of pages; each page is a list of sections; a
   section is either one of the ready-made kinds or a blank one built out
   of rows, columns and elements. What each kind is, and what settings it
   offers, is described once in blocks.js — this file turns those
   descriptions into an editing panel, so adding a new kind of block never
   means touching the CMS.

   The middle of the builder is the real website in a frame, loaded with
   ?edit=1. Clicking anything in it selects that part; the panel on the
   right edits it; every keystroke is pushed back to the frame. Nothing
   reaches visitors until "Publish changes" is pressed.
   ===================================================================== */
'use strict';

var API       = 'api.php';
var TOKEN_KEY = 'wesley_cms_token';
var DRAFT_KEY = 'wesley_cms_draft_v2';

var token     = null;
var content   = null;   // working copy (what you see in the editor)
var published = null;   // last known copy on the server
var dirty     = false;
var screenId  = 'dashboard';
var messages  = [];
var media     = [];
var settings  = {};
var stats     = {};

/* Builder state */
var pageId    = null;   // the page open in the builder
var selection = null;   // { kind, id } — the part being edited

/* ---------------------------------------------------------------------
   Tiny helpers
   --------------------------------------------------------------------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function getPath(path) {
    return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, content);
}
function setPath(path, val) {
    var p = path.split('.'), o = content;
    for (var i = 0; i < p.length - 1; i++) {
        if (o[p[i]] == null) o[p[i]] = {};
        o = o[p[i]];
    }
    o[p[p.length - 1]] = val;
}
function toast(msg, isError) {
    var t = $('toast');
    $('toastMsg').textContent = msg;
    t.className = 'toast show ' + (isError ? 'err' : 'ok');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 3200);
}
function timeAgo(iso) {
    if (!iso) return 'never';
    var then = new Date(iso.replace(' ', 'T'));
    if (isNaN(then)) return iso;
    var s = Math.round((Date.now() - then.getTime()) / 1000);
    if (s < 60)    return 'just now';
    if (s < 3600)  return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' hr ago';
    if (s < 604800) return Math.round(s / 86400) + ' days ago';
    return then.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function fullDate(iso) {
    if (!iso) return '';
    var d = new Date(iso.replace(' ', 'T'));
    return isNaN(d) ? iso : d.toLocaleString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function bytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return Math.round(n / 1024) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }

/* ---------------------------------------------------------------------
   Server calls
   --------------------------------------------------------------------- */
function api(action, payload, method) {
    var url = API;
    var opts = { headers: { 'Content-Type': 'application/json' }, cache: 'no-store' };
    if ((method || 'POST') === 'GET') {
        url += '?action=' + encodeURIComponent(action) + (token ? '&token=' + encodeURIComponent(token) : '');
        opts.method = 'GET';
        delete opts.headers;
    } else {
        opts.method = 'POST';
        var body = payload || {};
        body.action = action;
        if (token) body.token = token;
        opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (r) {
        if (r.status === 401) { signOut(true); throw new Error('Your session expired — please sign in again.'); }
        return r.json().catch(function () { throw new Error('The server sent an unexpected response.'); })
                .then(function (j) {
                    if (!r.ok) throw new Error((j && j.error) || 'Request failed.');
                    return j;
                });
    });
}

/* ---------------------------------------------------------------------
   Sign in / out
   --------------------------------------------------------------------- */
$('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('loginBtn'), pw = $('pw').value;
    $('loginErr').textContent = '';
    btn.disabled = true;
    fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', password: pw })
    }).then(function (r) {
        btn.disabled = false;
        if (r.status === 401) { $('loginErr').textContent = 'That password is not right. Try again.'; return null; }
        if (!r.ok) throw new Error('bad');
        return r.json();
    }).then(function (j) {
        if (!j || !j.token) return;
        token = j.token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
        startApp();
    }).catch(function () {
        btn.disabled = false;
        $('loginErr').textContent = 'Could not reach the server. Check your connection and try again.';
    });
});

function signOut(expired) {
    token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    $('app').classList.remove('ready');
    $('loginScreen').style.display = 'flex';
    $('pw').value = '';
    $('loginErr').textContent = expired ? 'Your session expired. Please sign in again.' : '';
}
$('logoutBtn').addEventListener('click', function () {
    if (dirty && !window.confirm('You have unpublished changes. Sign out anyway?')) return;
    signOut(false);
});

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
function startApp() {
    $('loginScreen').style.display = 'none';
    $('app').classList.add('ready');

    api('content', null, 'GET').then(function (j) {
        published = SITE.normalise(j.content);
        content   = clone(published);

        // Offer to bring back an unpublished draft from a previous visit.
        var draft = null;
        try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
        if (draft && JSON.stringify(draft) !== JSON.stringify(published)) {
            if (window.confirm('You have changes from a previous session that were never published.\n\nRestore them?')) {
                content = SITE.normalise(draft);
                markDirty();
            } else {
                localStorage.removeItem(DRAFT_KEY);
            }
        }

        pageId = (SITE.homePage(content) || {}).id || null;
        go(screenId);
        refreshStats();
        loadSettings();
        loadMessages();
    }).catch(function (err) { toast(err.message, true); });
}

function refreshStats() {
    api('stats', null, 'GET').then(function (j) {
        stats = j;
        var b = $('unreadBadge');
        b.textContent = j.unread;
        b.style.display = j.unread > 0 ? '' : 'none';
        if (screenId === 'dashboard') render();
    }).catch(function () {});
}

/* ---------------------------------------------------------------------
   Dirty tracking, publishing
   --------------------------------------------------------------------- */
function markDirty() {
    dirty = true;
    $('topbar').classList.add('is-dirty');
    $('saveText').textContent = 'Unpublished changes';
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(content)); } catch (e) {}
    schedulePreview();
}
function markClean() {
    dirty = false;
    $('topbar').classList.remove('is-dirty');
    $('saveText').textContent = 'All changes published';
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}
window.addEventListener('beforeunload', function (e) {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
});

$('publishBtn').addEventListener('click', publish);
function publish() {
    if (!dirty) { toast('Nothing new to publish.'); return; }
    var btn = $('publishBtn');
    btn.disabled = true;
    $('saveText').textContent = 'Publishing…';
    api('save', { content: content, revision: 1, note: 'Published from the CMS' })
        .then(function () {
            published = clone(content);
            markClean();
            btn.disabled = false;
            toast('Published — the website is updated for everyone.');
            refreshStats();
        })
        .catch(function (err) {
            btn.disabled = false;
            $('saveText').textContent = 'Not published';
            toast(err.message, true);
        });
}

/* ---------------------------------------------------------------------
   Pushing the working copy to whichever frames are showing it
   --------------------------------------------------------------------- */
var previewTimer = null;
function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(pushPreview, 140);
}
function targetOrigin() {
    return window.location.origin && window.location.origin !== 'null' ? window.location.origin : '*';
}
function pushPreview(extra) {
    extra = extra || {};

    var canvas = $('canvasFrame');
    if (canvas && canvas.contentWindow) {
        var toCanvas = { type: 'wesley-preview', content: content,
                         pageId: pageId, selected: selection };
        Object.keys(extra).forEach(function (k) { toCanvas[k] = extra[k]; });
        try { canvas.contentWindow.postMessage(toCanvas, targetOrigin()); } catch (e) {}
    }

    var side = $('previewFrame');
    if (side && side.contentWindow && $('preview').classList.contains('open')) {
        try { side.contentWindow.postMessage({ type: 'wesley-preview', content: content }, targetOrigin()); } catch (e) {}
    }
}
function reloadPreview() {
    var frame = $('previewFrame');
    if (frame && frame.contentWindow) frame.contentWindow.location.reload();
}
$('previewBtn').addEventListener('click', function () {
    var open = $('preview').classList.toggle('open');
    $('main').classList.toggle('with-preview', open && screenId !== 'pages');
    if (open) setTimeout(pushPreview, 700);
});
$('previewReload').addEventListener('click', function () { reloadPreview(); setTimeout(pushPreview, 800); });
$('previewFrame').addEventListener('load', function () { setTimeout(pushPreview, 120); });

/* ---------------------------------------------------------------------
   Navigation
   --------------------------------------------------------------------- */
document.querySelectorAll('.side-item').forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.screen); $('sidebar').classList.remove('open'); });
});
$('menuBtn').addEventListener('click', function () { $('sidebar').classList.toggle('open'); });

function go(id) {
    screenId = id;
    document.querySelectorAll('.side-item').forEach(function (b) {
        b.classList.toggle('active', b.dataset.screen === id);
    });
    // The builder brings its own canvas, so the side preview steps aside.
    $('main').classList.toggle('is-builder', id === 'pages');
    $('main').classList.toggle('with-preview', id !== 'pages' && $('preview').classList.contains('open'));

    if (id === 'messages') loadMessages();
    if (id === 'media')    loadMedia();
    if (id === 'settings') loadSettings();
    if (id === 'history')  loadHistory();
    render();
    window.scrollTo(0, 0);
}

/* =====================================================================
   FIELDS

   Every input carries data-bind="path.in.content", so one delegated
   listener writes any change back to the working copy. The `fields`
   list on a block definition is turned into inputs by field() below.
   ===================================================================== */
function joinPath(base, key) { return base ? base + '.' + key : key; }

function fText(label, path, opts) {
    opts = opts || {};
    return '<div class="fld"><label for="f_' + esc(path) + '">' + esc(label) + '</label>' +
        '<input type="' + (opts.type || 'text') + '" id="f_' + esc(path) + '" data-bind="' + esc(path) + '" ' +
        'value="' + esc(getPath(path)) + '" placeholder="' + esc(opts.placeholder || '') + '">' +
        (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
}
function fArea(label, path, opts) {
    opts = opts || {};
    return '<div class="fld"><label for="f_' + esc(path) + '">' + esc(label) + '</label>' +
        '<textarea id="f_' + esc(path) + '" data-bind="' + esc(path) + '" rows="' + (opts.rows || 3) + '" ' +
        'placeholder="' + esc(opts.placeholder || '') + '">' + esc(getPath(path)) + '</textarea>' +
        (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
}
function fCheck(label, path, hint) {
    return '<label class="check"><input type="checkbox" data-bind="' + esc(path) + '" data-type="bool"' +
        (getPath(path) !== false ? ' checked' : '') + '>' +
        '<span>' + esc(label) + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</span></label>';
}
function fList(label, path, hint) {
    var v = (getPath(path) || []).join(', ');
    return '<div class="fld"><label>' + esc(label) + '</label>' +
        '<input type="text" data-bind="' + esc(path) + '" data-type="list" value="' + esc(v) + '">' +
        '<div class="hint">' + esc(hint || 'Separate each one with a comma.') + '</div></div>';
}
function fSelect(label, path, options, hint) {
    var cur = String(getPath(path));
    return '<div class="fld"><label>' + esc(label) + '</label><select data-bind="' + esc(path) + '">' +
        options.map(function (o) {
            var value = o.v !== undefined ? o.v : o.value;
            var text  = o.l !== undefined ? o.l : o.label;
            return '<option value="' + esc(value) + '"' + (String(value) === cur ? ' selected' : '') + '>' +
                   esc(text) + '</option>';
        }).join('') + '</select>' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function fRange(label, path, min, max, hint, unit) {
    return '<div class="fld"><label>' + esc(label) + ' — <span data-range-out="' + esc(path) + '">' +
            esc(getPath(path)) + '</span>' + (unit === undefined ? '%' : esc(unit)) + '</label>' +
        '<input type="range" min="' + min + '" max="' + max + '" data-bind="' + esc(path) + '" data-type="num" ' +
        'value="' + esc(getPath(path)) + '">' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function fImage(label, path, hint) {
    var v = getPath(path) || '';
    return '<div class="fld"><label>' + esc(label) + '</label>' +
        '<div class="img-field">' +
            '<div class="img-thumb" data-thumb="' + esc(path) + '"' +
                (v ? ' style="background-image:url(\'' + esc(v) + '\')"' : '') + '>' +
                (v ? '' : '<i class="fas fa-image"></i>') + '</div>' +
            '<div class="img-actions">' +
                '<input type="text" data-bind="' + esc(path) + '" data-image="1" value="' + esc(v) + '" ' +
                    'placeholder="No photo chosen — pick one or paste a link">' +
                '<div class="img-buttons">' +
                    '<button type="button" class="btn tiny" data-pick="' + esc(path) + '"><i class="fas fa-photo-film"></i> Choose photo</button>' +
                    (v ? '<button type="button" class="btn tiny danger" data-clear="' + esc(path) + '"><i class="fas fa-times"></i> Remove</button>' : '') +
                '</div>' +
            '</div>' +
        '</div>' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function fColour(label, path, hint) {
    var v = getPath(path) || '#F2B705';
    var hex = /^#[0-9a-f]{6}$/i.test(v) ? v : '#F2B705';
    return '<div class="fld"><label>' + esc(label) + '</label>' +
        '<div class="colour-field">' +
            '<input type="color" value="' + esc(hex) + '" data-colour="' + esc(path) + '">' +
            '<input type="text" data-bind="' + esc(path) + '" data-colour-text="' + esc(path) + '" ' +
                'value="' + esc(v) + '" placeholder="#F2B705">' +
        '</div>' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function fIcon(label, path, hint) {
    var v = getPath(path) || '';
    var shown = v && !/^fa[srlbdt]\s/.test(v) ? 'fas ' + v : v;
    return '<div class="fld"><label>' + esc(label) + '</label>' +
        '<div class="icon-field">' +
            '<div class="icon-preview" data-icon-preview="' + esc(path) + '">' +
                (v ? '<i class="' + esc(shown) + '"></i>' : '<i class="fas fa-question" style="opacity:0.3"></i>') + '</div>' +
            '<input type="text" data-bind="' + esc(path) + '" data-icon-text="' + esc(path) + '" ' +
                'value="' + esc(v) + '" placeholder="fa-star">' +
            '<button type="button" class="btn tiny" data-icon-pick="' + esc(path) + '">Browse</button>' +
        '</div>' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function fRich(label, path, hint) {
    var v = getPath(path) || '';
    var bar = [
        ['bold', 'fa-bold', 'Bold'], ['italic', 'fa-italic', 'Italic'],
        ['h2', 'fa-heading', 'Heading'], ['link', 'fa-link', 'Add a link'],
        ['ul', 'fa-list-ul', 'Bulleted list'], ['ol', 'fa-list-ol', 'Numbered list'],
        ['quote', 'fa-quote-left', 'Quote'], ['clear', 'fa-eraser', 'Remove formatting']
    ].map(function (b) {
        return '<button type="button" data-rte="' + b[0] + '" title="' + b[2] + '"><i class="fas ' + b[1] + '"></i></button>';
    }).join('');

    return '<div class="fld"><label>' + esc(label) + '</label>' +
        '<div class="rte"><div class="rte-bar">' + bar + '</div>' +
        '<div class="rte-body" contenteditable="true" data-rich="' + esc(path) + '">' + v + '</div></div>' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}

/* Repeatable lists. The item's own field list is stashed against its path
   so "add one more" knows what a new entry looks like. */
var ITEM_DEFS = {};

function fItems(def, path) {
    var arr = getPath(path) || [];
    ITEM_DEFS[path] = def.item;

    var rows = arr.map(function (entry, i) {
        var label = typeof def.item.label === 'function' ? def.item.label(entry) : (entry.title || 'Item');
        var thumb = def.item.thumb ? entry[def.item.thumb] : '';
        return '<div class="item">' +
            '<div class="item-head">' +
                (thumb !== undefined && def.item.thumb
                    ? '<span class="thumb" style="' + (thumb ? 'background-image:url(\'' + esc(thumb) + '\')' : '') + '"></span>'
                    : '<span class="num">' + (i + 1) + '</span>') +
                '<span class="title">' + esc(label || 'Untitled') + '</span>' +
                '<button class="btn tiny" data-move="' + esc(path) + ':' + i + ':-1" title="Move up"><i class="fas fa-arrow-up"></i></button>' +
                '<button class="btn tiny" data-move="' + esc(path) + ':' + i + ':1" title="Move down"><i class="fas fa-arrow-down"></i></button>' +
                '<button class="btn tiny" data-dup-item="' + esc(path) + ':' + i + '" title="Make a copy"><i class="fas fa-clone"></i></button>' +
                '<button class="btn tiny danger" data-del="' + esc(path) + ':' + i + '" title="Delete"><i class="fas fa-trash"></i></button>' +
            '</div>' +
            '<div class="item-body">' +
                def.item.fields.map(function (f) { return field(f, path + '.' + i); }).join('') +
            '</div></div>';
    }).join('');

    var full = def.max && arr.length >= def.max;
    return '<div class="fld"><label>' + esc(def.label) + '</label>' +
        (rows || '<p class="empty">Nothing here yet.</p>') +
        (def.hint ? '<div class="hint" style="margin-bottom:0.5rem">' + esc(def.hint) + '</div>' : '') +
        '<div class="add-row"><button class="btn gold" data-add-item="' + esc(path) + '"' +
            (full ? ' disabled' : '') + '><i class="fas fa-plus"></i> ' + esc(def.addLabel || 'Add one more') +
        '</button></div></div>';
}

/* One field of any kind, from its description in blocks.js. */
function field(def, base) {
    if (def.t === 'note') return '<p class="fld-note">' + def.text + '</p>';

    if (def.t === 'group') {
        return '<details class="grp"' + (def.open ? ' open' : '') + '>' +
            '<summary>' + esc(def.label) + '</summary>' +
            '<div class="grp-body">' + def.fields.map(function (f) { return field(f, base); }).join('') + '</div>' +
        '</details>';
    }

    var path = joinPath(base, def.k);

    switch (def.t) {
        case 'text':   return fText(def.label, path, { hint: def.hint });
        case 'link':   return fText(def.label, path, { hint: def.hint, placeholder: '/about, #vision or https://…' });
        case 'area':   return fArea(def.label, path, { hint: def.hint, rows: def.rows });
        case 'rich':   return fRich(def.label, path, def.hint);
        case 'check':  return fCheck(def.label, path, def.hint);
        case 'list':   return fList(def.label, path, def.hint);
        case 'select': return fSelect(def.label, path, def.options, def.hint);
        case 'range':  return fRange(def.label, path, def.min, def.max, def.hint, def.unit);
        case 'image':  return fImage(def.label, path, def.hint);
        case 'colour':
        case 'color':  return fColour(def.label, path, def.hint);
        case 'icon':   return fIcon(def.label, path, def.hint);
        case 'items':  return fItems(def, path);
        default:       return '';
    }
}

function fields(list, base) {
    return (list || []).map(function (f) { return field(f, base); }).join('');
}

/* =====================================================================
   THE BUILDER
   ===================================================================== */

/* Find any part of the site by its id, and work out the dot-path that
   reaches it, so the inspector's inputs can bind straight to it. */
function locate(id) {
    var pages = content.pages;
    for (var p = 0; p < pages.length; p++) {
        var page = pages[p];
        for (var s = 0; s < page.sections.length; s++) {
            var sec = page.sections[s];
            var secPath = 'pages.' + p + '.sections.' + s;
            if (sec.id === id) {
                return { kind: 'section', obj: sec, arr: page.sections, index: s,
                         path: secPath, page: page, section: sec };
            }
            var rows = (sec.data && sec.data.rows) || [];
            for (var r = 0; r < rows.length; r++) {
                var row = rows[r];
                var rowPath = secPath + '.data.rows.' + r;
                if (row.id === id) {
                    return { kind: 'row', obj: row, arr: rows, index: r,
                             path: rowPath, page: page, section: sec, row: row };
                }
                for (var c = 0; c < (row.columns || []).length; c++) {
                    var col = row.columns[c];
                    var colPath = rowPath + '.columns.' + c;
                    if (col.id === id) {
                        return { kind: 'column', obj: col, arr: row.columns, index: c,
                                 path: colPath, page: page, section: sec, row: row, column: col };
                    }
                    for (var e = 0; e < (col.elements || []).length; e++) {
                        if (col.elements[e].id === id) {
                            return { kind: 'element', obj: col.elements[e], arr: col.elements, index: e,
                                     path: colPath + '.elements.' + e,
                                     page: page, section: sec, row: row, column: col };
                        }
                    }
                }
            }
        }
    }
    return null;
}

function currentPage() {
    return SITE.pageById(content, pageId) || SITE.homePage(content);
}
function currentPageIndex() {
    var pg = currentPage();
    return content.pages.indexOf(pg);
}

/* ---- the builder's shell, built once per visit to the screen ---- */
function scPages() {
    return '<div class="builder" id="builderRoot">' +
        '<div class="bd-rail">' +
            '<div class="bd-rail-head"><i class="fas fa-file-lines"></i> Pages</div>' +
            '<div class="bd-rail-list" id="pageList"></div>' +
            '<div class="bd-rail-foot">' +
                '<button class="btn gold block" id="addPageBtn"><i class="fas fa-plus"></i> New page</button>' +
            '</div>' +
        '</div>' +
        '<div class="bd-canvas" id="bdCanvas">' +
            '<div class="bd-canvas-head">' +
                '<i class="fas fa-hand-pointer" style="color:var(--gold-deep)"></i> Click anything on the page to edit it' +
                '<span style="flex:1"></span>' +
                '<button class="vw-btn active" data-vw="desktop" title="Desktop"><i class="fas fa-desktop"></i></button>' +
                '<button class="vw-btn" data-vw="tablet" title="Tablet"><i class="fas fa-tablet-screen-button"></i></button>' +
                '<button class="vw-btn" data-vw="phone" title="Phone"><i class="fas fa-mobile-screen"></i></button>' +
                '<button class="btn tiny" id="canvasReload" title="Reload the canvas"><i class="fas fa-rotate"></i></button>' +
            '</div>' +
            '<div class="bd-canvas-wrap">' +
                '<iframe id="canvasFrame" title="The page you are editing"></iframe>' +
            '</div>' +
        '</div>' +
        '<div class="bd-inspect">' +
            '<div class="bd-inspect-head"><i class="fas fa-sliders"></i> <span id="inspectTitle">Page</span></div>' +
            '<div class="bd-crumb" id="inspectCrumb"></div>' +
            '<div class="bd-inspect-body" id="inspectBody"></div>' +
        '</div>' +
    '</div>';
}

function wireBuilder() {
    var frame = $('canvasFrame');
    frame.src = 'index.html?edit=1&page=' + encodeURIComponent(pageId || '');

    $('addPageBtn').addEventListener('click', addPage);
    $('canvasReload').addEventListener('click', function () {
        frame.contentWindow.location.reload();
    });
    $('pageList').addEventListener('click', function (e) {
        var b = e.target.closest('[data-page]');
        if (!b) return;
        openPage(b.dataset.page);
    });
    document.querySelectorAll('.vw-btn').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('.vw-btn').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            var c = $('bdCanvas');
            c.classList.remove('w-tablet', 'w-phone');
            if (b.dataset.vw !== 'desktop') c.classList.add('w-' + b.dataset.vw);
        });
    });
}

function openPage(id) {
    pageId = id;
    selection = null;
    paintPages();
    paintInspector();
    pushPreview({ keepScroll: false });
}

function paintPages() {
    var list = $('pageList');
    if (!list) return;
    var cur = currentPage();
    list.innerHTML = content.pages.map(function (p) {
        return '<button class="pg' + (cur && p.id === cur.id ? ' active' : '') + '" data-page="' + esc(p.id) + '">' +
            '<i class="fas ' + (p.home ? 'fa-house' : 'fa-file-lines') + '"></i>' +
            '<span class="nm">' + esc(p.title) +
                '<span class="sl" style="display:block">' + esc(p.home ? '/' : '/' + p.slug) + '</span>' +
            '</span>' +
            (p.showInNav === false ? '<i class="fas fa-eye-slash" title="Not listed in the footer"></i>' : '') +
        '</button>';
    }).join('');
}

/* ---- the inspector: whatever is selected, or the page itself ---- */
function paintInspector() {
    var body = $('inspectBody');
    if (!body) return;
    ITEM_DEFS = {};

    var found = selection ? locate(selection.id) : null;
    if (selection && !found) selection = null;   // it was deleted underneath us

    $('inspectTitle').textContent = found
        ? ({ section: 'Section', row: 'Row', column: 'Column', element: 'Element' })[found.kind]
        : 'Page';
    $('inspectCrumb').innerHTML = crumbHtml(found);
    body.innerHTML = found ? inspectorFor(found) : pageInspector();
}

function crumbHtml(found) {
    var page = currentPage();
    var parts = ['<button data-select="">' + esc(page ? page.title : 'Page') + '</button>'];
    if (found) {
        var chain = [];
        if (found.section) chain.push({ id: found.section.id, label: BLOCKS.sectionLabel(found.section) });
        if (found.row && found.kind !== 'row')      chain.push({ id: found.row.id, label: 'Row' });
        if (found.column && found.kind !== 'column') chain.push({ id: found.column.id, label: 'Column' });
        if (found.kind === 'element') chain.push({ id: found.obj.id, label: BLOCKS.elementLabel(found.obj) });
        if (found.kind === 'row')     chain.push({ id: found.obj.id, label: 'Row' });
        if (found.kind === 'column')  chain.push({ id: found.obj.id, label: 'Column' });

        chain.forEach(function (c, i) {
            var last = i === chain.length - 1;
            parts.push(last ? '<span class="now">' + esc(c.label) + '</span>'
                            : '<button data-select="' + esc(c.id) + '">' + esc(c.label) + '</button>');
        });
    }
    return parts.join('<i class="fas fa-chevron-right"></i>');
}

/* Settings for the page as a whole, plus its outline. */
function pageInspector() {
    var i = currentPageIndex();
    if (i < 0) return '<p class="empty">No page open.</p>';
    var page = content.pages[i];
    var base = 'pages.' + i;

    var outline = page.sections.map(function (s) {
        var def = BLOCKS.sections[s.type] || {};
        return '<button class="out-item' + (s.show ? '' : ' off') + '" data-select="' + esc(s.id) + '">' +
            '<i class="fas ' + esc(def.icon || 'fa-square') + '"></i>' +
            '<span class="nm">' + esc(BLOCKS.sectionLabel(s)) + '</span>' +
            (s.show ? '' : '<i class="fas fa-eye-slash" title="Hidden"></i>') +
        '</button>';
    }).join('');

    return '<div class="fld"><label>Sections on this page</label>' +
            (outline || '<p class="empty">This page is empty.</p>') +
            '<div class="add-row"><button class="btn gold block" data-add-section="end">' +
                '<i class="fas fa-plus"></i> Add a section</button></div>' +
        '</div>' +

        '<details class="grp" open><summary>Page settings</summary><div class="grp-body">' +
            fText('Page name', base + '.title', { hint: 'Shown in the menu, the footer and the browser tab.' }) +
            (page.home
                ? '<p class="fld-note">This is the home page, so its address is simply <strong>/</strong>.</p>'
                : fText('Address', base + '.slug',
                        { hint: 'The site will show this page at <strong>/' + esc(page.slug) + '</strong>. Letters, numbers and dashes only.' })) +
            fCheck('List this page in the footer', base + '.showInNav') +
            (page.home ? '' :
                '<div class="add-row" style="margin-bottom:0.9rem">' +
                    '<button class="btn" data-set-home="' + esc(page.id) + '"><i class="fas fa-house"></i> Make this the home page</button>' +
                    '<button class="btn danger" data-del-page="' + esc(page.id) + '"><i class="fas fa-trash"></i> Delete page</button>' +
                '</div>') +
        '</div></details>' +

        '<details class="grp"><summary>Search engines</summary><div class="grp-body">' +
            '<p class="fld-note">Leave these empty and the page name is used.</p>' +
            fText('Browser tab title', base + '.seo.title') +
            fArea('Description', base + '.seo.description',
                  { hint: 'The sentence Google shows under the link. About 155 characters.' }) +
        '</div></details>';
}

/* Settings for the selected section / row / column / element. */
function inspectorFor(found) {
    var path = found.path;

    if (found.kind === 'element') {
        var edef = BLOCKS.elements[found.obj.type] || { fields: [] };
        return '<p class="fld-note"><i class="fas ' + esc(edef.icon || 'fa-square') + '"></i> ' +
                   esc(edef.label || found.obj.type) + '</p>' +
            fields(edef.fields, path) +
            elementActions(found);
    }

    if (found.kind === 'row') {
        return fields(BLOCKS.rowFields, path) + rowActions(found);
    }

    if (found.kind === 'column') {
        return '<p class="fld-note">A column holds elements. How many columns a row has is set on the row itself.</p>' +
            fields(BLOCKS.columnFields, path) +
            '<div class="add-row"><button class="btn gold block" data-add-element="' + esc(found.obj.id) + '">' +
                '<i class="fas fa-plus"></i> Add an element here</button></div>';
    }

    // A section.
    var sdef = BLOCKS.sections[found.obj.type] || { fields: [] };
    var styleFields = BLOCKS.sectionStyleFields.filter(function (f) {
        // The three self-sizing kinds offer their own height instead.
        return !(sdef.fixedPad && (f.k === 'padTop' || f.k === 'padBottom'));
    });

    return '<p class="fld-note"><i class="fas ' + esc(sdef.icon || 'fa-square') + '"></i> ' + esc(sdef.label) + '</p>' +
        fCheck('Show this section on the website', path + '.show') +
        fText('Name it in this list', path + '.name',
              { hint: 'Only you see this — it helps when a page has several similar sections.' }) +
        (sdef.fields && sdef.fields.length
            ? '<details class="grp" open><summary>Content</summary><div class="grp-body">' +
                  fields(sdef.fields, path + '.data') + '</div></details>'
            : '') +
        (found.obj.type === 'blocks'
            ? '<div class="add-row" style="margin-bottom:0.9rem">' +
                  '<button class="btn gold block" data-add-row="' + esc(found.obj.id) + '">' +
                  '<i class="fas fa-plus"></i> Add a row</button></div>'
            : '') +
        '<details class="grp"><summary>Background &amp; spacing</summary><div class="grp-body">' +
            fields(styleFields, path + '.style') + '</div></details>' +
        sectionActions(found);
}

function actionRow(id, kind, extra) {
    return '<div class="add-row" style="margin-top:1rem;border-top:1px solid var(--line);padding-top:0.9rem">' +
        '<button class="btn" data-bd="up:' + kind + ':' + esc(id) + '"><i class="fas fa-arrow-up"></i></button>' +
        '<button class="btn" data-bd="down:' + kind + ':' + esc(id) + '"><i class="fas fa-arrow-down"></i></button>' +
        '<button class="btn" data-bd="duplicate:' + kind + ':' + esc(id) + '"><i class="fas fa-clone"></i> Copy</button>' +
        '<button class="btn danger" data-bd="delete:' + kind + ':' + esc(id) + '"><i class="fas fa-trash"></i> Delete</button>' +
        (extra || '') + '</div>';
}
function sectionActions(f) { return actionRow(f.obj.id, 'section', ''); }
function rowActions(f)     { return actionRow(f.obj.id, 'row', ''); }
function elementActions(f) { return actionRow(f.obj.id, 'element', ''); }

/* ---- messages coming back from the canvas ---- */
window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin && window.location.origin !== 'null') return;
    var msg = e.data;
    if (!msg) return;

    if (msg.type === 'wesley-ready') { pushPreview({ keepScroll: false }); return; }
    if (msg.type !== 'wesley-edit') return;

    if (msg.action === 'select') {
        selection = msg.id ? { kind: msg.kind, id: msg.id } : null;
        paintInspector();
        pushPreview();
        return;
    }
    builderAction(msg.action, msg.kind, msg.id);
});

/* Every structural change the canvas or the inspector can ask for. */
function builderAction(action, kind, id) {
    if (action === 'addend')   { chooseSection('end'); return; }
    if (action === 'addafter') { chooseSection(id); return; }
    if (action === 'add') {
        if (kind === 'row')     { addRow(id); return; }
        if (kind === 'element') { chooseElement(id); return; }
        return;
    }

    var f = locate(id);
    if (!f) return;

    if (action === 'toggle') {
        f.obj.show = !f.obj.show;
        changed(id);
        return;
    }

    if (action === 'up' || action === 'down') {
        var to = f.index + (action === 'up' ? -1 : 1);
        if (to < 0 || to >= f.arr.length) return;
        var moved = f.arr.splice(f.index, 1)[0];
        f.arr.splice(to, 0, moved);
        // Columns get their width from the row's layout, not from where
        // they sit, so put the widths back after a swap.
        if (f.kind === 'column') {
            var spec = BLOCKS.layout(f.row.layout);
            f.arr.forEach(function (c, i) { c.width = spec.cols[i]; });
        }
        changed(id);
        return;
    }

    if (action === 'duplicate') {
        var copy = withNewIds(clone(f.obj));
        f.arr.splice(f.index + 1, 0, copy);
        selection = { kind: f.kind, id: copy.id };
        changed(copy.id);
        return;
    }

    if (action === 'delete') {
        var what = { section: 'section', row: 'row', element: 'element', column: 'column' }[f.kind];
        if (f.kind === 'column') { toast('A column goes when you change the row\'s layout.', true); return; }
        if (f.kind === 'section' && f.arr.length === 1 && content.pages.length === 1) {
            // Allowed, but worth saying — an empty home page is a blank site.
        }
        confirmAction('Delete this ' + what + '?',
            'It disappears from the editor straight away. Nothing changes on the live website until you publish.',
            function () {
                f.arr.splice(f.index, 1);
                selection = null;
                changed(null);
            });
        return;
    }
}

/* Anything copied needs fresh ids, or two parts of the page would answer
   to the same one. */
function withNewIds(obj) {
    if (Array.isArray(obj)) { obj.forEach(withNewIds); return obj; }
    if (obj && typeof obj === 'object') {
        if (obj.id) obj.id = BLOCKS.uid();
        Object.keys(obj).forEach(function (k) {
            if (obj[k] && typeof obj[k] === 'object') withNewIds(obj[k]);
        });
    }
    return obj;
}

/* Redraw after a structural change. */
function changed(scrollToId) {
    markDirty();
    paintPages();
    paintInspector();
    pushPreview(scrollToId ? { scrollTo: scrollToId } : {});
}

/* ---- adding things ---- */
function chooseSection(after) {
    openBlockChooser('Add a section', sectionChoices(), function (key) {
        var sec = BLOCKS.newSection(key);
        if (!sec) return;
        var page = currentPage();
        if (after === 'end') {
            page.sections.push(sec);
        } else {
            var f = locate(after);
            page.sections.splice(f ? f.index + 1 : page.sections.length, 0, sec);
        }
        selection = { kind: 'section', id: sec.id };
        changed(sec.id);
        toast('Section added.');
    });
}

function sectionChoices() {
    var groups = {};
    Object.keys(BLOCKS.sections).forEach(function (key) {
        var d = BLOCKS.sections[key];
        (groups[d.group] = groups[d.group] || []).push({ key: key, label: d.label, icon: d.icon });
    });
    BLOCKS.presets.forEach(function (p) {
        (groups[p.group] = groups[p.group] || []).push({ key: p.key, label: p.label, icon: p.icon });
    });
    return groups;
}

function chooseElement(columnId) {
    var groups = {};
    Object.keys(BLOCKS.elements).forEach(function (key) {
        var d = BLOCKS.elements[key];
        (groups[d.group] = groups[d.group] || []).push({ key: key, label: d.label, icon: d.icon });
    });
    openBlockChooser('Add an element', groups, function (key) {
        var f = locate(columnId);
        if (!f || f.kind !== 'column') return;
        var el = BLOCKS.newElement(key);
        f.obj.elements.push(el);
        selection = { kind: 'element', id: el.id };
        changed(el.id);
        toast('Element added.');
    });
}

function addRow(sectionId) {
    var f = locate(sectionId);
    if (!f || f.obj.type !== 'blocks') return;
    openBlockChooser('Choose a layout for the new row', {
        'Columns': BLOCKS.layouts.map(function (l) {
            return { key: l.v, label: l.l, icon: layoutIcon(l.cols.length) };
        })
    }, function (key) {
        var row = BLOCKS.newRow(key);
        f.obj.data.rows.push(row);
        selection = { kind: 'row', id: row.id };
        changed(row.id);
    });
}
function layoutIcon(n) {
    return n === 1 ? 'fa-square' : n === 2 ? 'fa-table-columns'
         : n === 3 ? 'fa-grip-lines-vertical' : 'fa-table-cells';
}

function openBlockChooser(title, groups, onPick) {
    $('blockTitle').innerHTML = '<i class="fas fa-plus"></i> ' + esc(title);
    $('blockBody').innerHTML = Object.keys(groups).map(function (g) {
        return '<div class="blk-group">' + esc(g) + '</div><div class="blk-grid">' +
            groups[g].map(function (b) {
                return '<button class="blk" data-blk="' + esc(b.key) + '">' +
                    '<i class="fas ' + esc(b.icon || 'fa-square') + '"></i>' + esc(b.label) + '</button>';
            }).join('') + '</div>';
    }).join('');
    blockPick = onPick;
    $('blockModal').classList.add('open');
}
var blockPick = null;
$('blockBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-blk]');
    if (!b || !blockPick) return;
    var cb = blockPick;
    blockPick = null;
    closeModals();
    cb(b.dataset.blk);
});

/* ---- pages ---- */
function addPage() {
    var title = window.prompt('What should the new page be called?', 'About us');
    if (title === null) return;
    title = title.trim();
    if (!title) return;

    var page = SITE.newPage(title);
    page.slug = SITE.uniqueSlug(content.pages, SITE.slugify(title), page.id);

    // A new page starts with a header carrying its name, so it is never blank.
    var header = BLOCKS.newSection('pagehero');
    header.data.title = title;
    page.sections = [header, BLOCKS.newSection('text')];

    content.pages.push(page);
    pageId = page.id;
    selection = null;
    markDirty();
    paintPages();
    paintInspector();
    var frame = $('canvasFrame');
    if (frame) frame.src = 'index.html?edit=1&page=' + encodeURIComponent(pageId);
    toast('Page created. It is at /' + page.slug + ' once you publish.');
}

function deletePage(id) {
    var page = SITE.pageById(content, id);
    if (!page || page.home) return;
    confirmAction('Delete "' + page.title + '"?',
        'The page and everything on it goes. Nothing changes on the live website until you publish.',
        function () {
            content.pages = content.pages.filter(function (p) { return p.id !== id; });
            // Any menu link that pointed here would go nowhere.
            content.nav.links = content.nav.links.filter(function (l) { return l.pageId !== id; });
            pageId = (SITE.homePage(content) || {}).id;
            selection = null;
            markDirty();
            paintPages();
            paintInspector();
            var frame = $('canvasFrame');
            if (frame) frame.src = 'index.html?edit=1&page=' + encodeURIComponent(pageId || '');
            toast('Page deleted.');
        });
}

function setHome(id) {
    content.pages.forEach(function (p) { p.home = (p.id === id); if (p.home) p.slug = ''; });
    // The page that used to be home needs an address of its own again.
    content.pages.forEach(function (p) {
        if (!p.home && !p.slug) p.slug = SITE.uniqueSlug(content.pages, SITE.slugify(p.title), p.id);
    });
    markDirty();
    paintPages();
    paintInspector();
    pushPreview({ keepScroll: false });
    toast('That is now the home page.');
}

/* =====================================================================
   THE OTHER SCREENS
   ===================================================================== */
function render() {
    // The app shell appears as soon as you sign in, a moment before the
    // content itself arrives. Clicking a menu item in that gap must not
    // throw — there is simply nothing to draw yet.
    if (!content) {
        $('main').innerHTML = '<div class="page-head"><p>Loading the website…</p></div>';
        return;
    }

    if (screenId === 'pages') {
        if (!$('builderRoot')) {
            $('main').innerHTML = scPages();
            wireBuilder();
        }
        paintPages();
        paintInspector();
        return;
    }

    var html = ({
        dashboard: scDashboard, messages: scMessages, contact: scContact,
        identity: scIdentity, menu: scMenu, footer: scFooter, media: scMedia,
        history: scHistory, settings: scSettings
    }[screenId] || scDashboard)();
    $('main').innerHTML = html;

    if (screenId === 'media')    wireDrop('mediaDrop', 'mediaFile', null);
    if (screenId === 'settings') wireSettings();
    if (screenId === 'history')  wireHistory();
}
