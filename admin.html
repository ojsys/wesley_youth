<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Website Manager — First UMC &amp; Wesley Foundation</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #F2B705;
            --gold-light: #FBCB2E;
            --gold-deep: #D99A00;
            --ink: #141210;
            --ink-2: #1E1A15;
            --ink-3: #2A251E;
            --cream: #FBF6E9;
            --paper: #FFFFFF;
            --bg: #F3F0E8;
            --text: #201C17;
            --muted: #7A7263;
            --line: #E2DCCC;
            --ok: #2F7D32;
            --warn: #B8791B;
            --danger: #C0392B;
            --topbar: 62px;
            --sidebar: 248px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Barlow', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.55; -webkit-font-smoothing: antialiased;
        }
        h1,h2,h3,h4 { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.3px; }
        a { color: var(--gold-deep); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #cdc6b4; border-radius: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* =========== Sign in =========== */
        .login-screen {
            position: fixed; inset: 0; z-index: 900;
            display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            background: radial-gradient(900px 600px at 50% -10%, #2a2419, var(--ink));
        }
        .login-card {
            width: 380px; max-width: 100%; background: var(--paper);
            border-radius: 18px; padding: 2.4rem 2.2rem;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        }
        .login-mark {
            width: 62px; height: 62px; border-radius: 18px; background: var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--ink); margin: 0 auto 1.2rem;
        }
        .login-card h1 { text-align: center; font-size: 1.35rem; text-transform: uppercase; }
        .login-card p.sub { text-align: center; color: var(--muted); font-size: 0.92rem; margin-bottom: 1.6rem; }
        .login-card label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 700; color: var(--muted); margin-bottom: 0.4rem; }
        .login-card input {
            width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--line);
            border-radius: 10px; font-size: 1rem; font-family: inherit; background: #FBFAF6;
        }
        .login-card input:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(242,183,5,0.25); }
        .login-card button {
            width: 100%; margin-top: 1.1rem; padding: 0.9rem; border: none; border-radius: 10px;
            background: var(--ink); color: var(--gold-light); font-family: 'Oswald', sans-serif;
            font-size: 0.95rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; cursor: pointer;
        }
        .login-card button:hover { background: var(--gold); color: var(--ink); }
        .login-err { color: var(--danger); font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.6rem; text-align: center; }
        .login-foot { text-align: center; margin-top: 1.4rem; font-size: 0.82rem; color: var(--muted); }

        /* =========== App shell =========== */
        .app { display: none; }
        .app.ready { display: block; }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--topbar); z-index: 300;
            background: var(--ink); color: var(--cream);
            display: flex; align-items: center; gap: 1rem; padding: 0 1rem 0 1.1rem;
        }
        .topbar .logo { display: flex; align-items: center; gap: 0.65rem; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }
        .topbar .logo i { color: var(--gold); font-size: 1.15rem; }
        .topbar .spacer { flex: 1; }
        .tb-btn {
            background: rgba(255,255,255,0.08); color: var(--cream); border: 1px solid rgba(255,255,255,0.14);
            padding: 0.5rem 0.85rem; border-radius: 9px; cursor: pointer; font-size: 0.82rem;
            font-family: 'Oswald', sans-serif; letter-spacing: 0.8px; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 0.45rem; text-decoration: none; white-space: nowrap;
        }
        .tb-btn:hover { background: rgba(255,255,255,0.16); }
        .tb-btn.primary { background: var(--gold); color: var(--ink); border-color: transparent; font-weight: 700; }
        .tb-btn.primary:hover { background: var(--gold-light); }
        .tb-btn[disabled] { opacity: 0.45; cursor: default; }
        .dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: none; }
        .is-dirty .dirty-dot { display: inline-block; }
        .save-state { font-size: 0.8rem; color: rgba(251,246,233,0.6); display: flex; align-items: center; gap: 0.45rem; }
        .menu-btn { display: none; background: none; border: none; color: var(--cream); font-size: 1.2rem; cursor: pointer; }

        .sidebar {
            position: fixed; top: var(--topbar); bottom: 0; left: 0; width: var(--sidebar); z-index: 250;
            background: var(--ink-2); color: rgba(251,246,233,0.75); overflow-y: auto; padding: 0.9rem 0 3rem;
        }
        .side-group { padding: 1.1rem 1.2rem 0.4rem; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(251,246,233,0.35); font-weight: 700; }
        .side-item {
            display: flex; align-items: center; gap: 0.75rem; width: 100%;
            padding: 0.62rem 1.2rem; background: none; border: none; cursor: pointer;
            color: inherit; font-family: 'Barlow', sans-serif; font-size: 0.93rem; text-align: left;
            border-left: 3px solid transparent;
        }
        .side-item i { width: 18px; text-align: center; color: rgba(251,203,46,0.75); font-size: 0.95rem; }
        .side-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .side-item.active { background: rgba(242,183,5,0.14); border-left-color: var(--gold); color: #fff; font-weight: 600; }
        .side-item .badge {
            margin-left: auto; background: var(--danger); color: #fff; border-radius: 20px;
            font-size: 0.68rem; padding: 0.05rem 0.45rem; font-weight: 700;
        }

        .main { margin: var(--topbar) 0 0 var(--sidebar); padding: 1.6rem 1.8rem 5rem; transition: margin-right 0.3s; }
        .main.with-preview { margin-right: 420px; }
        .page-head { margin-bottom: 1.4rem; }
        .page-head h2 { font-size: 1.5rem; text-transform: uppercase; }
        .page-head p { color: var(--muted); font-size: 0.95rem; max-width: 70ch; }

        /* =========== Cards & fields =========== */
        .card {
            background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
            padding: 1.4rem 1.5rem; margin-bottom: 1.1rem; max-width: 940px;
        }
        .card > h3 {
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.2px;
            padding-bottom: 0.75rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 0.55rem;
        }
        .card > h3 i { color: var(--gold-deep); }
        .card > h3 .h3-note { margin-left: auto; font-family: 'Barlow'; text-transform: none; letter-spacing: 0; font-size: 0.8rem; color: var(--muted); font-weight: 400; }

        .fld { margin-bottom: 1rem; }
        .fld > label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; color: var(--muted); margin-bottom: 0.35rem; }
        .fld input[type=text], .fld input[type=email], .fld input[type=url], .fld input[type=password], .fld textarea, .fld select {
            width: 100%; padding: 0.62rem 0.75rem; border: 1px solid var(--line); border-radius: 9px;
            font-family: inherit; font-size: 0.95rem; background: #FCFBF7; color: var(--text);
        }
        .fld textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
        .fld input:focus, .fld textarea:focus, .fld select:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(242,183,5,0.2); }
        .fld .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 1rem; }
        @media (max-width: 700px) { .row, .row-3 { grid-template-columns: 1fr; } }

        .check { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.9rem; }
        .check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--gold-deep); flex-shrink: 0; }
        .check span { font-size: 0.92rem; }
        .check .hint { display: block; color: var(--muted); font-size: 0.82rem; }

        .fld input[type=range] { width: 100%; accent-color: var(--gold-deep); }

        /* image picker */
        .img-field { display: flex; gap: 0.75rem; align-items: center; }
        .img-thumb {
            width: 74px; height: 58px; border-radius: 9px; background-size: cover; background-position: center;
            border: 1px solid var(--line); background-color: #EDE8DA; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; color: #B9AF95; font-size: 1.1rem;
        }
        .img-actions { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 0; }
        .img-buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; }

        .btn {
            border: 1px solid var(--line); background: #FAF8F1; color: var(--text);
            padding: 0.5rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            font-family: inherit; display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap;
        }
        .btn:hover { background: #F1ECDD; border-color: #D2C9B0; }
        .btn.gold { background: var(--gold); border-color: transparent; font-weight: 600; }
        .btn.gold:hover { background: var(--gold-light); }
        .btn.dark { background: var(--ink); color: var(--gold-light); border-color: transparent; }
        .btn.dark:hover { background: var(--ink-3); }
        .btn.danger { color: var(--danger); border-color: #E8C9C4; background: #FDF4F3; }
        .btn.danger:hover { background: #F9E5E2; }
        .btn.tiny { padding: 0.3rem 0.5rem; font-size: 0.78rem; }
        .btn[disabled] { opacity: 0.5; cursor: default; }

        /* repeatable items */
        .item {
            border: 1px solid var(--line); border-radius: 12px; margin-bottom: 0.9rem;
            background: #FCFBF7; overflow: hidden;
        }
        .item-head {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem;
            background: #F5F1E5; border-bottom: 1px solid var(--line);
        }
        .item-head .num {
            width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--gold-light);
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
        }
        .item-head .title {
            font-family: 'Oswald', sans-serif; font-size: 0.9rem; letter-spacing: 0.4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .item-body { padding: 1rem 0.9rem 0.3rem; }
        .item-body.collapsed { display: none; }
        .add-row { margin-top: 0.3rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

        .empty { color: var(--muted); font-size: 0.92rem; padding: 1rem 0; text-align: center; }

        /* dashboard */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.9rem; max-width: 940px; margin-bottom: 1.1rem; }
        .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem; }
        .stat .n { font-family: 'Oswald', sans-serif; font-size: 1.9rem; line-height: 1; }
        .stat .l { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-top: 0.35rem; }
        .stat i { color: var(--gold-deep); float: right; font-size: 1.1rem; }
        .quick { display: flex; flex-wrap: wrap; gap: 0.6rem; }

        /* messages */
        .msg {
            border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
            margin-bottom: 0.7rem; overflow: hidden;
        }
        .msg.unread { border-left: 4px solid var(--gold); }
        .msg-head { display: flex; gap: 0.75rem; align-items: center; padding: 0.85rem 1rem; cursor: pointer; }
        .msg-head .who { font-weight: 600; }
        .msg-head .sub { color: var(--muted); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-head .when { margin-left: auto; color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
        .msg-body { padding: 0 1rem 1rem; border-top: 1px solid var(--line); }
        .msg-body.hidden { display: none; }
        .msg-body pre { white-space: pre-wrap; font-family: inherit; font-size: 0.95rem; margin: 0.9rem 0; }
        .msg-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .pill { font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
        .pill.warn { background: #FBEFD8; color: var(--warn); }
        .pill.ok { background: #E4F1E4; color: var(--ok); }

        /* media library */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; }
        .media-tile {
            border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--paper);
            cursor: pointer; position: relative;
        }
        .media-tile img { width: 100%; height: 118px; object-fit: cover; display: block; background: #EDE8DA; cursor: copy; }
        .media-tile .meta { padding: 0.45rem 0.55rem; font-size: 0.72rem; color: var(--muted); word-break: break-all; }
        .media-tile:hover { border-color: var(--gold-deep); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .media-in {
            width: 100%; margin-bottom: 0.3rem; padding: 0.3rem 0.4rem; font-family: inherit;
            font-size: 0.76rem; border: 1px solid var(--line); border-radius: 6px; background: #FCFBF7; color: var(--text);
        }
        .media-in:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 2px rgba(242,183,5,0.2); }
        .media-facts { display: block; font-size: 0.7rem; color: var(--muted); }
        .media-tile .del {
            position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.92);
            border: 1px solid var(--line); border-radius: 7px; width: 26px; height: 26px; cursor: pointer;
            color: var(--danger); display: none; align-items: center; justify-content: center; font-size: 0.75rem;
        }
        .media-tile:hover .del { display: flex; }
        .dropzone {
            border: 2px dashed #D5CDB6; border-radius: 12px; padding: 1.6rem; text-align: center;
            color: var(--muted); margin-bottom: 1.1rem; background: #FBFAF5;
        }
        .dropzone.over { border-color: var(--gold-deep); background: #FDF6E2; }

        /* preview panel */
        .preview {
            position: fixed; top: var(--topbar); right: 0; bottom: 0; width: 420px; z-index: 200;
            background: #E9E4D6; border-left: 1px solid var(--line); display: none; flex-direction: column;
        }
        .preview.open { display: flex; }
        .preview-head { padding: 0.55rem 0.8rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--paper); }
        .preview iframe { flex: 1; width: 100%; border: none; background: #fff; }

        /* modal */
        .modal-back {
            position: fixed; inset: 0; background: rgba(20,18,16,0.55); z-index: 800;
            display: none; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .modal-back.open { display: flex; }
        .modal {
            background: var(--paper); border-radius: 16px; width: 760px; max-width: 100%;
            max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 30px 70px rgba(0,0,0,0.4);
        }
        .modal-head { padding: 1rem 1.2rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 0.6rem; }
        .modal-head h3 { font-size: 1rem; text-transform: uppercase; flex: 1; }
        .modal-body { padding: 1.2rem; overflow-y: auto; }
        .modal-foot { padding: 0.85rem 1.2rem; border-top: 1px solid var(--line); display: flex; gap: 0.5rem; justify-content: flex-end; }
        .modal.small { width: 420px; }

        /* toast */
        .toast {
            position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(140px);
            background: var(--ink); color: var(--cream); padding: 0.8rem 1.3rem; border-radius: 50px;
            z-index: 1000; transition: transform 0.35s ease; display: flex; align-items: center; gap: 0.55rem;
            box-shadow: 0 14px 34px rgba(0,0,0,0.35); font-size: 0.92rem; max-width: 90vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.err { background: var(--danger); color: #fff; }
        .toast.ok i { color: var(--gold); }

        @media (max-width: 1100px) { .main.with-preview { margin-right: 0; } .preview { width: 100%; } }
        @media (max-width: 860px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.25s; }
            .sidebar.open { transform: none; }
            .main { margin-left: 0; padding: 1.1rem 1rem 4rem; }
            .menu-btn { display: block; }
            .topbar .logo span { display: none; }
        }
    </style>
</head>
<body>

<!-- ================= SIGN IN ================= -->
<div class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm">
        <div class="login-mark"><i class="fas fa-church"></i></div>
        <h1>Website Manager</h1>
        <p class="sub">First UMC &amp; Wesley Foundation</p>
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password" placeholder="Enter your password">
        <div class="login-err" id="loginErr"></div>
        <button type="submit" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Sign in</button>
        <p class="login-foot"><a href="index.html">← Back to the website</a></p>
    </form>
</div>

<!-- ================= APP ================= -->
<div class="app" id="app">

    <div class="topbar" id="topbar">
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <div class="logo"><i class="fas fa-church"></i> <span>Website Manager</span></div>
        <div class="spacer"></div>
        <div class="save-state" id="saveState"><span class="dirty-dot"></span><span id="saveText">All changes published</span></div>
        <button class="tb-btn" id="previewBtn" title="Show a live preview beside the editor"><i class="fas fa-desktop"></i> Preview</button>
        <a class="tb-btn" href="index.html" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> View site</a>
        <button class="tb-btn primary" id="publishBtn"><i class="fas fa-cloud-arrow-up"></i> Publish changes</button>
        <button class="tb-btn" id="logoutBtn" title="Sign out"><i class="fas fa-power-off"></i></button>
    </div>

    <nav class="sidebar" id="sidebar">
        <div class="side-group">Overview</div>
        <button class="side-item" data-screen="dashboard"><i class="fas fa-gauge-high"></i> Dashboard</button>
        <button class="side-item" data-screen="messages"><i class="fas fa-inbox"></i> Messages <span class="badge" id="unreadBadge" style="display:none">0</span></button>

        <div class="side-group">Page content</div>
        <button class="side-item" data-screen="hero"><i class="fas fa-house"></i> Home / Top section</button>
        <button class="side-item" data-screen="vm"><i class="fas fa-eye"></i> Vision &amp; Mission</button>
        <button class="side-item" data-screen="impact"><i class="fas fa-hands-holding-circle"></i> Impact Areas</button>
        <button class="side-item" data-screen="gather"><i class="fas fa-calendar-day"></i> Gatherings</button>
        <button class="side-item" data-screen="gallery"><i class="fas fa-images"></i> Photo Gallery</button>
        <button class="side-item" data-screen="connect"><i class="fas fa-envelope-open-text"></i> Contact &amp; Socials</button>

        <div class="side-group">Site-wide</div>
        <button class="side-item" data-screen="identity"><i class="fas fa-fingerprint"></i> Identity &amp; Logo</button>
        <button class="side-item" data-screen="menu"><i class="fas fa-bars-staggered"></i> Menu</button>
        <button class="side-item" data-screen="footer"><i class="fas fa-shoe-prints"></i> Footer</button>

        <div class="side-group">Tools</div>
        <button class="side-item" data-screen="media"><i class="fas fa-photo-film"></i> Media Library</button>
        <button class="side-item" data-screen="history"><i class="fas fa-clock-rotate-left"></i> History</button>
        <button class="side-item" data-screen="settings"><i class="fas fa-gear"></i> Settings</button>
    </nav>

    <main class="main" id="main"></main>

    <aside class="preview" id="preview">
        <div class="preview-head">
            <i class="fas fa-bolt" style="color:var(--gold-deep)"></i> Live preview — updates as you type
            <button class="btn tiny" id="previewReload" style="margin-left:auto"><i class="fas fa-rotate"></i></button>
        </div>
        <iframe id="previewFrame" src="index.html" title="Website preview"></iframe>
    </aside>
</div>

<!-- ================= MEDIA PICKER MODAL ================= -->
<div class="modal-back" id="mediaModal">
    <div class="modal">
        <div class="modal-head">
            <h3><i class="fas fa-photo-film"></i> Choose a photo</h3>
            <button class="btn tiny" data-close-modal><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="dropzone" id="pickDrop">
                <i class="fas fa-cloud-arrow-up" style="font-size:1.5rem;color:var(--gold-deep)"></i>
                <p style="margin-top:0.4rem">Drag a photo here, or
                    <label style="color:var(--gold-deep);cursor:pointer;text-decoration:underline">browse your device
                        <input type="file" accept="image/*" multiple style="display:none" id="pickFile">
                    </label>
                </p>
            </div>
            <div class="media-grid" id="pickGrid"></div>
        </div>
    </div>
</div>

<!-- ================= CONFIRM MODAL ================= -->
<div class="modal-back" id="confirmModal">
    <div class="modal small">
        <div class="modal-head"><h3 id="confirmTitle">Are you sure?</h3></div>
        <div class="modal-body"><p id="confirmText"></p></div>
        <div class="modal-foot">
            <button class="btn" data-close-modal>Cancel</button>
            <button class="btn danger" id="confirmOk">Yes, do it</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><i class="fas fa-circle-check"></i> <span id="toastMsg"></span></div>
<input type="file" id="restoreFile" accept="application/json" style="display:none">

<script src="content.js"></script>
<script>
/* =====================================================================
   Website Manager — a small content management system for the
   First UMC & Wesley Foundation site.

   Everything an admin edits lives in one JSON document (see content.js).
   Edits change a working copy + the live preview instantly; nothing goes
   live on the real website until "Publish changes" is pressed.
   ===================================================================== */
'use strict';

var API       = 'api.php';
var TOKEN_KEY = 'wesley_cms_token';
var DRAFT_KEY = 'wesley_cms_draft';

var token    = null;
var content  = null;   // working copy (what you see in the editor)
var published = null;  // last known copy on the server
var dirty    = false;
var screenId = 'dashboard';
var messages = [];
var media    = [];
var settings = {};
var stats    = {};

/* ---------------------------------------------------------------------
   Tiny helpers
   --------------------------------------------------------------------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function getPath(path) {
    return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, content);
}
function setPath(path, val) {
    var p = path.split('.'), o = content;
    for (var i = 0; i < p.length - 1; i++) {
        if (o[p[i]] == null) o[p[i]] = {};
        o = o[p[i]];
    }
    o[p[p.length - 1]] = val;
}
function toast(msg, isError) {
    var t = $('toast');
    $('toastMsg').textContent = msg;
    t.className = 'toast show ' + (isError ? 'err' : 'ok');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 3200);
}
function timeAgo(iso) {
    if (!iso) return 'never';
    var then = new Date(iso.replace(' ', 'T'));
    if (isNaN(then)) return iso;
    var s = Math.round((Date.now() - then.getTime()) / 1000);
    if (s < 60)    return 'just now';
    if (s < 3600)  return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' hr ago';
    if (s < 604800) return Math.round(s / 86400) + ' days ago';
    return then.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function fullDate(iso) {
    if (!iso) return '';
    var d = new Date(iso.replace(' ', 'T'));
    return isNaN(d) ? iso : d.toLocaleString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function bytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return Math.round(n / 1024) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
}

/* ---------------------------------------------------------------------
   Server calls
   --------------------------------------------------------------------- */
function api(action, payload, method) {
    var url = API;
    var opts = { headers: { 'Content-Type': 'application/json' }, cache: 'no-store' };
    if ((method || 'POST') === 'GET') {
        url += '?action=' + encodeURIComponent(action) + (token ? '&token=' + encodeURIComponent(token) : '');
        opts.method = 'GET';
        delete opts.headers;
    } else {
        opts.method = 'POST';
        var body = payload || {};
        body.action = action;
        if (token) body.token = token;
        opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (r) {
        if (r.status === 401) { signOut(true); throw new Error('Your session expired — please sign in again.'); }
        return r.json().catch(function () { throw new Error('The server sent an unexpected response.'); })
                .then(function (j) {
                    if (!r.ok) throw new Error((j && j.error) || 'Request failed.');
                    return j;
                });
    });
}

/* ---------------------------------------------------------------------
   Sign in / out
   --------------------------------------------------------------------- */
$('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('loginBtn'), pw = $('pw').value;
    $('loginErr').textContent = '';
    btn.disabled = true;
    fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', password: pw })
    }).then(function (r) {
        btn.disabled = false;
        if (r.status === 401) { $('loginErr').textContent = 'That password is not right. Try again.'; return null; }
        if (!r.ok) throw new Error('bad');
        return r.json();
    }).then(function (j) {
        if (!j || !j.token) return;
        token = j.token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
        startApp();
    }).catch(function () {
        btn.disabled = false;
        $('loginErr').textContent = 'Could not reach the server. Check your connection and try again.';
    });
});

function signOut(expired) {
    token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    $('app').classList.remove('ready');
    $('loginScreen').style.display = 'flex';
    $('pw').value = '';
    $('loginErr').textContent = expired ? 'Your session expired. Please sign in again.' : '';
}
$('logoutBtn').addEventListener('click', function () {
    if (dirty && !window.confirm('You have unpublished changes. Sign out anyway?')) return;
    signOut(false);
});

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
function startApp() {
    $('loginScreen').style.display = 'none';
    $('app').classList.add('ready');

    api('content', null, 'GET').then(function (j) {
        published = SITE.normalise(j.content);
        content   = SITE.clone(published);

        // Offer to bring back an unpublished draft from a previous visit.
        var draft = null;
        try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
        if (draft && JSON.stringify(draft) !== JSON.stringify(published)) {
            if (window.confirm('You have changes from a previous session that were never published.\n\nRestore them?')) {
                content = SITE.normalise(draft);
                markDirty();
            } else {
                localStorage.removeItem(DRAFT_KEY);
            }
        }
        go(screenId);
        refreshStats();
        loadSettings();
        loadMessages();
    }).catch(function (err) { toast(err.message, true); });
}

function refreshStats() {
    api('stats', null, 'GET').then(function (j) {
        stats = j;
        var b = $('unreadBadge');
        b.textContent = j.unread;
        b.style.display = j.unread > 0 ? '' : 'none';
        if (screenId === 'dashboard') render();
    }).catch(function () {});
}

/* ---------------------------------------------------------------------
   Dirty tracking, publishing
   --------------------------------------------------------------------- */
function markDirty() {
    dirty = true;
    $('topbar').classList.add('is-dirty');
    $('saveText').textContent = 'Unpublished changes';
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(content)); } catch (e) {}
    schedulePreview();
}
function markClean() {
    dirty = false;
    $('topbar').classList.remove('is-dirty');
    $('saveText').textContent = 'All changes published';
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}
window.addEventListener('beforeunload', function (e) {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
});

$('publishBtn').addEventListener('click', publish);
function publish() {
    if (!dirty) { toast('Nothing new to publish.'); return; }
    var btn = $('publishBtn');
    btn.disabled = true;
    $('saveText').textContent = 'Publishing…';
    api('save', { content: content, revision: 1, note: 'Published from the CMS' })
        .then(function () {
            published = SITE.clone(content);
            markClean();
            btn.disabled = false;
            toast('Published — the website is updated for everyone.');
            reloadPreview();
            refreshStats();
        })
        .catch(function (err) {
            btn.disabled = false;
            $('saveText').textContent = 'Not published';
            toast(err.message, true);
        });
}

/* ---------------------------------------------------------------------
   Live preview
   --------------------------------------------------------------------- */
var previewTimer = null;
function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(pushPreview, 160);
}
function pushPreview() {
    var frame = $('previewFrame');
    if (!$('preview').classList.contains('open') || !frame.contentWindow) return;
    var origin = window.location.origin && window.location.origin !== 'null' ? window.location.origin : '*';
    try { frame.contentWindow.postMessage({ type: 'wesley-preview', content: content }, origin); } catch (e) {}
}
function reloadPreview() {
    var frame = $('previewFrame');
    if (frame.contentWindow) frame.contentWindow.location.reload();
}
$('previewBtn').addEventListener('click', function () {
    var open = $('preview').classList.toggle('open');
    $('main').classList.toggle('with-preview', open);
    if (open) setTimeout(pushPreview, 700);
});
$('previewReload').addEventListener('click', function () { reloadPreview(); setTimeout(pushPreview, 800); });
$('previewFrame').addEventListener('load', function () { setTimeout(pushPreview, 120); });

/* ---------------------------------------------------------------------
   Navigation
   --------------------------------------------------------------------- */
document.querySelectorAll('.side-item').forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.screen); $('sidebar').classList.remove('open'); });
});
$('menuBtn').addEventListener('click', function () { $('sidebar').classList.toggle('open'); });

function go(id) {
    screenId = id;
    document.querySelectorAll('.side-item').forEach(function (b) {
        b.classList.toggle('active', b.dataset.screen === id);
    });
    if (id === 'messages') loadMessages();
    if (id === 'media')    loadMedia();
    if (id === 'settings') loadSettings();
    if (id === 'history')  loadHistory();
    render();
    window.scrollTo(0, 0);
}

/* =====================================================================
   FIELD BUILDERS — every input carries data-bind="path.in.content"
   ===================================================================== */
function fText(label, path, opts) {
    opts = opts || {};
    return '<div class="fld"><label for="f_' + path + '">' + esc(label) + '</label>' +
        '<input type="' + (opts.type || 'text') + '" id="f_' + path + '" data-bind="' + path + '" ' +
        'value="' + esc(getPath(path)) + '" placeholder="' + esc(opts.placeholder || '') + '">' +
        (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
}
function fArea(label, path, opts) {
    opts = opts || {};
    return '<div class="fld"><label for="f_' + path + '">' + esc(label) + '</label>' +
        '<textarea id="f_' + path + '" data-bind="' + path + '" placeholder="' + esc(opts.placeholder || '') + '">' +
        esc(getPath(path)) + '</textarea>' +
        (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
}
function fCheck(label, path, hint) {
    return '<label class="check"><input type="checkbox" data-bind="' + path + '" data-type="bool"' +
        (getPath(path) !== false ? ' checked' : '') + '>' +
        '<span>' + esc(label) + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</span></label>';
}
function fList(label, path, hint) {
    var v = (getPath(path) || []).join(', ');
    return '<div class="fld"><label>' + esc(label) + '</label>' +
        '<input type="text" data-bind="' + path + '" data-type="list" value="' + esc(v) + '">' +
        '<div class="hint">' + esc(hint || 'Separate each one with a comma.') + '</div></div>';
}
function fSelect(label, path, options, hint) {
    var cur = getPath(path);
    return '<div class="fld"><label>' + esc(label) + '</label><select data-bind="' + path + '">' +
        options.map(function (o) {
            return '<option value="' + esc(o.value) + '"' + (o.value === cur ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        }).join('') + '</select>' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function fRange(label, path, min, max, hint, unit) {
    return '<div class="fld"><label>' + esc(label) + ' — <span data-range-out="' + path + '">' + esc(getPath(path)) + '</span>' + (unit === undefined ? '%' : unit) + '</label>' +
        '<input type="range" min="' + min + '" max="' + max + '" data-bind="' + path + '" data-type="num" value="' + esc(getPath(path)) + '">' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function fImage(label, path, hint) {
    var v = getPath(path) || '';
    return '<div class="fld"><label>' + esc(label) + '</label>' +
        '<div class="img-field">' +
            '<div class="img-thumb" data-thumb="' + path + '"' +
                (v ? ' style="background-image:url(\'' + esc(v) + '\')"' : '') + '>' +
                (v ? '' : '<i class="fas fa-image"></i>') + '</div>' +
            '<div class="img-actions">' +
                '<input type="text" data-bind="' + path + '" data-image="1" value="' + esc(v) + '" placeholder="No photo chosen — pick one or paste a link">' +
                '<div class="img-buttons">' +
                    '<button type="button" class="btn tiny" data-pick="' + path + '"><i class="fas fa-photo-film"></i> Choose photo</button>' +
                    (v ? '<button type="button" class="btn tiny danger" data-clear="' + path + '"><i class="fas fa-times"></i> Remove</button>' : '') +
                '</div>' +
            '</div>' +
        '</div>' +
        (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function itemBox(index, title, inner, arrayPath, opts) {
    opts = opts || {};
    return '<div class="item">' +
        '<div class="item-head">' +
            '<span class="num">' + (index + 1) + '</span>' +
            '<span class="title">' + esc(title || 'Untitled') + '</span>' +
            '<button class="btn tiny" data-move="' + arrayPath + ':' + index + ':-1" title="Move up"><i class="fas fa-arrow-up"></i></button>' +
            '<button class="btn tiny" data-move="' + arrayPath + ':' + index + ':1" title="Move down"><i class="fas fa-arrow-down"></i></button>' +
            '<button class="btn tiny danger" data-del="' + arrayPath + ':' + index + '" title="' + esc(opts.delLabel || 'Delete') + '"><i class="fas fa-trash"></i></button>' +
        '</div>' +
        '<div class="item-body">' + inner + '</div></div>';
}

/* =====================================================================
   SCREENS
   ===================================================================== */
function render() {
    var html = ({
        dashboard: scDashboard, messages: scMessages, hero: scHero, vm: scVM,
        impact: scImpact, gather: scGather, gallery: scGallery, connect: scConnect,
        identity: scIdentity, menu: scMenu, footer: scFooter, media: scMedia,
        history: scHistory, settings: scSettings
    }[screenId] || scDashboard)();
    $('main').innerHTML = html;
}

function head(title, sub) {
    return '<div class="page-head"><h2>' + esc(title) + '</h2>' +
        (sub ? '<p>' + sub + '</p>' : '') + '</div>';
}

/* ---- Dashboard ---- */
function scDashboard() {
    var recent = messages.slice(0, 3);
    return head('Dashboard', 'Everything on the website is edited from here. Make your changes, then press <strong>Publish changes</strong> at the top.') +
    '<div class="stats">' +
        '<div class="stat"><i class="fas fa-inbox"></i><div class="n">' + (stats.unread || 0) + '</div><div class="l">Unread messages</div></div>' +
        '<div class="stat"><i class="fas fa-images"></i><div class="n">' + (content.gallery.items.length) + '</div><div class="l">Gallery photos</div></div>' +
        '<div class="stat"><i class="fas fa-calendar-day"></i><div class="n">' + (content.gather.items.length) + '</div><div class="l">Gatherings listed</div></div>' +
        '<div class="stat"><i class="fas fa-clock-rotate-left"></i><div class="n">' + (stats.revisions || 0) + '</div><div class="l">Saved versions</div></div>' +
    '</div>' +
    '<div class="card"><h3><i class="fas fa-bolt"></i> Jump straight to</h3>' +
        '<div class="quick">' +
            '<button class="btn" data-go="gather"><i class="fas fa-calendar-day"></i> Add or edit a gathering</button>' +
            '<button class="btn" data-go="gallery"><i class="fas fa-images"></i> Add gallery photos</button>' +
            '<button class="btn" data-go="connect"><i class="fas fa-share-nodes"></i> Social links</button>' +
            '<button class="btn" data-go="messages"><i class="fas fa-inbox"></i> Read messages</button>' +
            '<button class="btn" data-go="hero"><i class="fas fa-house"></i> Change the top of the page</button>' +
        '</div>' +
        '<p class="hint" style="margin-top:0.9rem;color:var(--muted);font-size:0.87rem">' +
            'Website last updated: <strong>' + esc(fullDate(stats.updated_at) || 'not yet') + '</strong>' +
            (dirty ? ' &nbsp;·&nbsp; <span style="color:var(--warn)"><i class="fas fa-circle-exclamation"></i> you have unpublished changes</span>' : '') +
        '</p>' +
    '</div>' +
    '<div class="card"><h3><i class="fas fa-envelope"></i> Latest messages ' +
        '<span class="h3-note"><button class="btn tiny" data-go="messages">See all</button></span></h3>' +
        (recent.length ? recent.map(function (m) {
            return '<div style="padding:0.5rem 0;border-bottom:1px solid var(--line)">' +
                '<strong>' + esc(m.name) + '</strong> <span style="color:var(--muted)">&lt;' + esc(m.email) + '&gt;</span>' +
                '<div style="color:var(--muted);font-size:0.9rem">' + esc((m.body || '').slice(0, 110)) + '…</div>' +
                '<div style="color:var(--muted);font-size:0.78rem">' + esc(timeAgo(m.created_at)) + '</div></div>';
        }).join('') : '<p class="empty">No messages yet — they will appear here as soon as someone uses the contact form.</p>') +
    '</div>';
}

/* ---- Home / hero ---- */
function scHero() {
    var h = content.hero;
    return head('Home — top section', 'The first thing visitors see. The rotating photo slideshow has been removed; the background is a calm plain colour by default. Photos now live in the <strong>Photo Gallery</strong>.') +
    '<div class="card"><h3><i class="fas fa-fill-drip"></i> Background</h3>' +
        fSelect('Background style', 'hero.background', [
            { value: 'plain', label: 'Plain background (recommended — nothing moving)' },
            { value: 'image', label: 'One still photo behind the words' }
        ], 'There is no slideshow any more. A single still photo stays calm and readable.') +
        (h.background === 'image'
            ? fImage('Background photo', 'hero.bgImage') +
              fRange('How much the photo is softened', 'hero.bgOverlay', 30, 100,
                     'Higher = the photo fades further into the background so the words stay easy to read.')
            : '') +
        fCheck('Show the church emblem at the top', 'hero.showEmblem') +
        fCheck('Show the illustrated skyline along the bottom', 'hero.showScene') +
    '</div>' +
    '<div class="card"><h3><i class="fas fa-heading"></i> Words</h3>' +
        fText('Small line above the title', 'hero.kicker') +
        fText('Church name', 'hero.title') +
        fText('Line under the church name', 'hero.titleSub') +
        '<div class="row">' + fText('Big headline — first line', 'hero.line1') +
                              fText('Big headline — second line (gold)', 'hero.line2') + '</div>' +
        fArea('Welcome paragraph', 'hero.sub') +
        fList('Value words', 'hero.values') +
    '</div>' +
    '<div class="card"><h3><i class="fas fa-hand-pointer"></i> Buttons</h3>' +
        '<div class="row-3">' +
            fText('Button 1 label', 'hero.btn1Text') +
            fText('Button 1 goes to', 'hero.btn1Link', { hint: 'e.g. #gather' }) +
            fText('Button 1 icon', 'hero.btn1Icon', { hint: iconHint() }) +
        '</div>' +
        '<div class="row-3">' +
            fText('Button 2 label', 'hero.btn2Text') +
            fText('Button 2 goes to', 'hero.btn2Link', { hint: 'e.g. #connect' }) +
            fText('Button 2 icon', 'hero.btn2Icon', { hint: iconHint() }) +
        '</div>' +
        '<p style="color:var(--muted);font-size:0.85rem">Leave a label empty to hide that button.</p>' +
    '</div>';
}
function iconHint() {
    return 'Font Awesome name, e.g. <code>fa-calendar-day</code>. <a href="https://fontawesome.com/search?o=r&amp;m=free" target="_blank" rel="noopener">Browse icons</a>';
}

/* ---- Vision & Mission ---- */
function scVM() {
    return head('Vision &amp; Mission') +
    '<div class="card"><h3><i class="fas fa-eye"></i> Section</h3>' +
        fCheck('Show this section on the website', 'vm.show') +
        fText('Small label above the title', 'vm.label') +
        '<div class="row">' + fText('Title — dark part', 'vm.titleMain') + fText('Title — gold part', 'vm.titleAccent') + '</div>' +
    '</div>' +
    '<div class="card"><h3><i class="fas fa-binoculars"></i> Vision</h3>' +
        fText('Heading', 'vm.visionTitle') + fArea('Text', 'vm.visionText') + '</div>' +
    '<div class="card"><h3><i class="fas fa-bullseye"></i> Mission</h3>' +
        fText('Heading', 'vm.missionTitle') + fArea('Text', 'vm.missionText') + '</div>';
}

/* ---- Impact areas ---- */
function scImpact() {
    var items = content.impact.areas.map(function (a, i) {
        return itemBox(i, a.title, '<div class="row">' +
            fText('Title', 'impact.areas.' + i + '.title') +
            fText('Icon', 'impact.areas.' + i + '.icon', { hint: iconHint() }) + '</div>' +
            fArea('Description', 'impact.areas.' + i + '.text'), 'impact.areas');
    }).join('');

    return head('Impact Areas') +
    '<div class="card"><h3><i class="fas fa-hands-holding-circle"></i> Section</h3>' +
        fCheck('Show this section on the website', 'impact.show') +
        fText('Small label above the title', 'impact.label') +
        '<div class="row">' + fText('Title — dark part', 'impact.titleMain') + fText('Title — gold part', 'impact.titleAccent') + '</div>' +
        fArea('Intro paragraph', 'impact.intro') +
    '</div>' +
    '<div class="card"><h3><i class="fas fa-list"></i> Areas <span class="h3-note">' + content.impact.areas.length + ' listed</span></h3>' +
        (items || '<p class="empty">No areas yet.</p>') +
        '<div class="add-row"><button class="btn gold" data-add="impact.areas"><i class="fas fa-plus"></i> Add an area</button>' +
        '<span style="color:var(--muted);font-size:0.85rem">Exactly 4 areas arranges them around the emblem; any other number uses a simple grid.</span></div>' +
    '</div>';
}

/* ---- Gatherings ---- */
function scGather() {
    var items = content.gather.items.map(function (e, i) {
        var p = 'gather.items.' + i + '.';
        return itemBox(i, e.title, fImage('Photo', p + 'image') +
            '<div class="row">' + fText('Title', p + 'title') + fText('Badge (e.g. Every Wednesday)', p + 'tag') + '</div>' +
            '<div class="row">' + fText('When', p + 'time') + fText('Where', p + 'location') + '</div>' +
            fArea('Description', p + 'desc') +
            '<div class="row">' + fText('Button label', p + 'btnText') + fText('Button goes to', p + 'btnLink') + '</div>',
            'gather.items');

/* =====================================================================
   EVENT WIRING — one delegated listener for the whole editor
   ===================================================================== */
var main = $('main');

main.addEventListener('input', function (e) {
    var el = e.target.closest('[data-bind]');
    if (!el) return;
    var path = el.dataset.bind, val;

    if (el.dataset.type === 'bool')      val = el.checked;
    else if (el.dataset.type === 'num')  val = Number(el.value);
    else if (el.dataset.type === 'list') val = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    else                                 val = el.value;

    setPath(path, val);
    markDirty();

    var out = main.querySelector('[data-range-out="' + path + '"]');
    if (out) out.textContent = el.value;

    if (el.dataset.image) {
        var thumb = main.querySelector('[data-thumb="' + path + '"]');
        if (thumb) {
            thumb.style.backgroundImage = el.value ? "url('" + el.value.replace(/'/g, '%27') + "')" : '';
            thumb.innerHTML = el.value ? '' : '<i class="fas fa-image"></i>';
        }
    }
    // The item header shows the title, so keep it in step while typing.
    var itemTitle = el.closest('.item');
    if (itemTitle && /\.(title|label)$/.test(path)) {
        itemTitle.querySelector('.item-head .title').textContent = el.value || 'Untitled';
    }
});

// Media library alt text / caption: these describe the photo itself, not the
// page, so they save straight away rather than waiting for Publish.
main.addEventListener('change', function (e) {
    var f = e.target.closest('[data-media-field]');
    if (!f) return;
    var parts = f.dataset.mediaField.split(':');
    var id = Number(parts[1]);
    var row = media.filter(function (m) { return m.id === id; })[0];
    if (!row) return;
    row[parts[0]] = f.value;
    api('media_update', { id: id, alt_text: row.alt_text || '', caption: row.caption || '' })
        .then(function () { toast('Saved.'); })
        .catch(function (err) { toast(err.message, true); });
});

main.addEventListener('change', function (e) {
    var el = e.target.closest('[data-bind]');
    if (!el || el.tagName !== 'SELECT') return;
    // Apply the choice here too — not every browser fires `input` on a
    // <select> — then redraw, because a choice can change which fields
    // are relevant (e.g. the hero background style).
    setPath(el.dataset.bind, el.value);
    markDirty();
    render();
});

main.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-add],[data-del],[data-move],[data-pick],[data-clear],' +
        '[data-add-social],[data-msg-toggle],[data-msg-del],[data-msg-unread],[data-media-del],' +
        '[data-copy],[data-restore],[data-bulk-gallery]');
    if (!t) return;
    var d = t.dataset;

    if (d.go)   { e.preventDefault(); go(d.go); return; }
    if (d.pick) { openPicker(d.pick); return; }

    if (d.clear) { setPath(d.clear, ''); markDirty(); render(); return; }

    if (d.add) {
        var arr = getPath(d.add);
        arr.push(newItemFor(d.add));
        markDirty(); render();
        return;
    }
    if (d.del) {
        var parts = d.del.split(':');
        confirmAction('Delete this item?', 'It will be gone from the editor. Nothing changes on the live website until you publish.', function () {
            getPath(parts[0]).splice(Number(parts[1]), 1);
            markDirty(); render();
        });
        return;
    }
    if (d.move) {
        var m = d.move.split(':');
        var list = getPath(m[0]), i = Number(m[1]), to = i + Number(m[2]);
        if (to < 0 || to >= list.length) return;
        var moved = list.splice(i, 1)[0];
        list.splice(to, 0, moved);
        markDirty(); render();
        return;
    }
    if (d.addSocial) {
        var sel = $('socialPreset');
        var preset = SITE.socialPresets[Number(sel.value)] || SITE.socialPresets[0];
        content.connect.socials.push({ label: preset.label, icon: preset.icon, url: preset.url });
        markDirty(); render();
        return;
    }
    if (d.bulkGallery) { openPicker('__gallery_bulk__'); return; }

    if (d.msgToggle) {
        var box = $('msgbody_' + d.msgToggle);
        box.classList.toggle('hidden');
        if (!box.classList.contains('hidden')) {
            api('message_read', { id: Number(d.msgToggle) }).then(function () {
                var m = messages.filter(function (x) { return x.id === Number(d.msgToggle); })[0];
                if (m) m.is_read = 1;
                refreshStats();
            }).catch(function () {});
        }
        return;
    }
    if (d.msgUnread) {
        api('message_read', { id: Number(d.msgUnread), unread: 1 })
            .then(function () { loadMessages(); refreshStats(); }).catch(function (x) { toast(x.message, true); });
        return;
    }
    if (d.msgDel) {
        confirmAction('Delete this message?', 'This cannot be undone.', function () {
            api('message_delete', { id: Number(d.msgDel) })
                .then(function () { loadMessages(); refreshStats(); toast('Message deleted.'); })
                .catch(function (x) { toast(x.message, true); });
        });
        return;
    }
    if (d.mediaDel) {
        e.stopPropagation();
        confirmAction('Delete this photo?', 'If it is used anywhere on the website that spot will go blank.', function () {
            api('media_delete', { name: d.mediaDel })
                .then(function () { loadMedia(); toast('Photo deleted.'); })
                .catch(function (x) { toast(x.message, true); });
        });
        return;
    }
    if (d.copy) {
        navigator.clipboard ? navigator.clipboard.writeText(d.copy).then(function () { toast('Link copied.'); })
                            : toast(d.copy);
        return;
    }
    if (d.restore) {
        confirmAction('Restore this version?', 'The website goes back to how it was then. Your current version is saved first, so you can undo this.', function () {
            api('revision_restore', { id: Number(d.restore) }).then(function (j) {
                content = SITE.normalise(j.content);
                published = SITE.clone(content);
                markClean();
                loadHistory(); reloadPreview();
                toast('That version has been restored and is live.');
            }).catch(function (x) { toast(x.message, true); });
        });
        return;
    }
});

/* What a freshly added item looks like. */
function newItemFor(arrayPath) {
    if (arrayPath === 'impact.areas')   return { icon: 'fa-star', title: 'New area', text: 'Describe it here…' };
    if (arrayPath === 'gather.items')   return { image: '', tag: 'New', time: 'Day · time', title: 'New gathering',
                                                 desc: 'Describe it here…', location: 'Where it happens',
                                                 btnText: 'Learn more', btnLink: '#connect' };
    if (arrayPath === 'gallery.items')  return { image: '', title: 'New photo', desc: '' };
    if (arrayPath === 'nav.links')      return { label: 'New link', href: '#' };
    return {};
}

/* ---------------------------------------------------------------------
   Media picker
   --------------------------------------------------------------------- */
var pickTarget = null;
function openPicker(path) {
    pickTarget = path;
    $('mediaModal').classList.add('open');
    paintPicker();
    loadMedia();
}
function paintPicker() {
    $('pickGrid').innerHTML = media.length
        ? media.map(function (m) {
            return '<div class="media-tile" data-choose="' + esc(m.url) + '">' +
                '<img src="' + esc(m.url) + '" alt="" loading="lazy">' +
                '<div class="meta">' + esc(m.name) + '</div></div>';
          }).join('')
        : '<p class="empty" style="grid-column:1/-1">Nothing uploaded yet — drop a photo above to get started.</p>';
}
$('pickGrid').addEventListener('click', function (e) {
    var tile = e.target.closest('[data-choose]');
    if (!tile || !pickTarget) return;
    chooseImage(tile.dataset.choose);
});
function chooseImage(url) {
    // Reuse whatever was written about this photo in the media library.
    var row = media.filter(function (m) { return m.url === url; })[0] || {};
    if (pickTarget === '__gallery_bulk__') {
        content.gallery.items.push({ image: url, title: row.caption || '', desc: row.alt_text || '' });
    } else {
        setPath(pickTarget, url);
        // Filling an empty gallery photo? Bring its words along too.
        var m = /^gallery\.items\.(\d+)\.image$/.exec(pickTarget);
        if (m) {
            var item = content.gallery.items[Number(m[1])];
            if (item && !item.title && row.caption)  item.title = row.caption;
            if (item && !item.desc  && row.alt_text) item.desc  = row.alt_text;
        }
    }
    markDirty();
    closeModals();
    render();
    toast('Photo added.');
}

/* ---------------------------------------------------------------------
   Uploading
   --------------------------------------------------------------------- */
function uploadFiles(files, onEach) {
    var list = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
    if (!list.length) { toast('Please choose image files.', true); return; }

    var done = 0;
    toast('Uploading ' + list.length + ' photo' + (list.length > 1 ? 's' : '') + '…');
    list.forEach(function (f) {
        var fd = new FormData();
        fd.append('action', 'upload');
        fd.append('token', token);
        fd.append('file', f);
        fetch(API + '?action=upload', { method: 'POST', body: fd })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                if (!res.ok || !res.j.ok) throw new Error(res.j.error || 'Upload failed.');
                done++;
                if (onEach) onEach(res.j.url);
                if (done === list.length) { toast('Uploaded.'); loadMedia(); }
            })
            .catch(function (err) { toast(err.message, true); });
    });
}

function wireDrop(zoneId, inputId, onUrl) {
    var zone = $(zoneId), input = $(inputId);
    if (!zone) return;
    ['dragenter', 'dragover'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('over'); });
    });
    zone.addEventListener('drop', function (e) { uploadFiles(e.dataTransfer.files, onUrl); });
    if (input) input.addEventListener('change', function () { uploadFiles(input.files, onUrl); input.value = ''; });
}
wireDrop('pickDrop', 'pickFile', function (url) {
    // First upload fills the field being edited; the rest just join the library.
    if (pickTarget === '__gallery_bulk__') {
        content.gallery.items.push({ image: url, title: '', desc: '' });
        markDirty();
    } else if (pickTarget) {
        setPath(pickTarget, url);
        pickTarget = null;
        markDirty();
        closeModals();
        render();
    }
});

/* Media Library screen is re-rendered, so wire its dropzone after each render. */
var _render = render;
render = function () {
    _render();
    if (screenId === 'media') wireDrop('mediaDrop', 'mediaFile', null);
    if (screenId === 'settings') wireSettings();
    if (screenId === 'history')  wireHistory();
};

/* ---------------------------------------------------------------------
   Settings actions
   --------------------------------------------------------------------- */
function wireSettings() {
    $('saveContactTo').addEventListener('click', function () {
        var v = $('contactTo').value.trim();
        api('settings_save', { settings: { contact_to: v } })
            .then(function () { settings.contact_to = v; toast('Saved — messages will go to ' + v + '.'); })
            .catch(function (e) { toast(e.message, true); });
    });
    $('testEmail').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        api('test_email', {}).then(function (j) {
            b.disabled = false;
            toast(j.ok ? 'Test email sent to ' + j.to + ' — check the inbox (and spam).'
                       : 'The server could not send the email. See DEPLOY-HPANEL.md for email setup.', !j.ok);
        }).catch(function (e) { b.disabled = false; toast(e.message, true); });
    });
    $('savePw').addEventListener('click', function () {
        var cur = $('pwCur').value, nw = $('pwNew').value;
        if (!cur || !nw) { toast('Fill in both password boxes.', true); return; }
        api('change_password', { current: cur, 'new': nw })
            .then(function () {
                $('pwCur').value = ''; $('pwNew').value = '';
                settings.custom_password = true;
                toast('Password changed. Use the new one next time you sign in.');
            })
            .catch(function (e) { toast(e.message, true); });
    });
}

function wireHistory() {
    $('backupBtn').addEventListener('click', function () {
        var blob = new Blob([JSON.stringify(content, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'wesley-website-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        toast('Backup downloaded.');
    });
    $('restoreBtn').addEventListener('click', function () { $('restoreFile').click(); });
}
$('restoreFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
        try {
            content = SITE.normalise(JSON.parse(r.result));
            markDirty(); render();
            toast('Backup loaded into the editor — press Publish changes to make it live.');
        } catch (err) { toast('That file could not be read as a backup.', true); }
    };
    r.readAsText(f);
    e.target.value = '';
});

/* ---------------------------------------------------------------------
   Modals
   --------------------------------------------------------------------- */
function closeModals() {
    document.querySelectorAll('.modal-back').forEach(function (m) { m.classList.remove('open'); });
}
document.addEventListener('click', function (e) {
    if (e.target.closest('[data-close-modal]')) closeModals();
    if (e.target.classList.contains('modal-back')) closeModals();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModals(); });

var confirmCb = null;
function confirmAction(title, text, cb) {
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    confirmCb = cb;
    $('confirmModal').classList.add('open');
}
$('confirmOk').addEventListener('click', function () {
    closeModals();
    if (confirmCb) confirmCb();
    confirmCb = null;
});

/* Ctrl/Cmd+S publishes. */
document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key && e.key.toLowerCase() === 's') { e.preventDefault(); publish(); }
});

/* ---------------------------------------------------------------------
   Start
   --------------------------------------------------------------------- */
(function () {
    try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
    if (!token) { $('pw').focus(); return; }
    // Check the saved session is still good before showing the editor.
    fetch(API + '?action=ping&token=' + encodeURIComponent(token))
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.authed) startApp(); else signOut(false); })
        .catch(function () { signOut(false); });
})();
</script>
